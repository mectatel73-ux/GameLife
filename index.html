<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ибрагим — Бесконечная дорога</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        overflow: hidden;
        font-family: 'Georgia', 'Times New Roman', serif;
        background: #000;
        user-select: none;
    }

    /* ==== ИГРОВОЙ ЭКРАН ==== */
    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    /* ==== ФОН СЛОЯ ==== */
    .bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        transition: opacity 1.2s ease, transform 8s ease;
        opacity: 0;
    }
    .bg.active { opacity: 1; transform: scale(1.05); }

    /* ЗАКАТ НА ТРАССЕ */
    .bg-road {
        background:
            radial-gradient(ellipse at 50% 60%, rgba(255,220,150,0.9) 0%, rgba(255,160,80,0.6) 20%, transparent 50%),
            radial-gradient(ellipse at 50% 40%, #ffb86c 0%, #ff8a3d 25%, #a04030 50%, #3a1a2a 75%, #1a0a15 100%);
    }
    .bg-road::before {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 45%;
        background: linear-gradient(180deg, transparent 0%, rgba(40,30,40,0.6) 30%, rgba(20,15,25,0.95) 100%);
    }
    .bg-road::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 45%;
        background: repeating-linear-gradient(180deg, #ffd966 0px, #ffd966 30px, transparent 30px, transparent 60px);
        opacity: 0.4;
    }

    /* КВАРТИРА */
    .bg-room {
        background:
            radial-gradient(circle at 30% 30%, rgba(255,200,120,0.15) 0%, transparent 40%),
            radial-gradient(circle at 70% 70%, rgba(120,80,180,0.15) 0%, transparent 40%),
            linear-gradient(135deg, #2a1e2e 0%, #1a1220 50%, #0f0a18 100%);
    }
    .bg-room::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
            linear-gradient(90deg, transparent 0%, rgba(255,200,120,0.08) 50%, transparent 100%),
            repeating-linear-gradient(0deg, transparent 0px, transparent 60px, rgba(255,255,255,0.02) 60px, rgba(255,255,255,0.02) 61px);
    }

    /* БАЛКОН НОЧЬЮ */
    .bg-night {
        background:
            radial-gradient(circle at 70% 20%, rgba(255,220,180,0.2) 0%, transparent 30%),
            linear-gradient(180deg, #1a1428 0%, #2a1a3a 40%, #3a1e2e 70%, #1a0a15 100%);
    }
    .bg-night::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 20% 15%, #fff 1px, transparent 2px),
            radial-gradient(circle at 60% 25%, #fff 1px, transparent 2px),
            radial-gradient(circle at 80% 10%, #fff 1px, transparent 2px),
            radial-gradient(circle at 35% 35%, #fff 1px, transparent 2px),
            radial-gradient(circle at 90% 40%, #fff 1px, transparent 2px),
            radial-gradient(circle at 15% 45%, #fff 1px, transparent 2px),
            radial-gradient(circle at 45% 55%, #fff 1px, transparent 2px);
        opacity: 0.6;
    }

    /* СКЛАД */
    .bg-warehouse {
        background:
            linear-gradient(180deg, #2a2a3a 0%, #1a1a28 100%);
    }
    .bg-warehouse::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
            repeating-linear-gradient(90deg, transparent 0px, transparent 80px, rgba(255,200,80,0.15) 80px, rgba(255,200,80,0.15) 82px),
            radial-gradient(circle at 50% 100%, rgba(255,200,80,0.25) 0%, transparent 60%);
    }

    /* ===== СПРАЙТ ИБРАГИМА ===== */
    #ibrahim {
        position: absolute;
        bottom: 220px;
        left: 50%;
        transform: translateX(-50%);
        width: 320px;
        height: 420px;
        transition: all 0.4s;
        filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
        z-index: 5;
    }

    .char {
        position: absolute;
        inset: 0;
        animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }

    /* Тело */
    .char-body {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 260px;
        background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
        border-radius: 60px 60px 30px 30px;
        box-shadow: inset 20px 0 40px rgba(255,255,255,0.05), inset -20px 0 40px rgba(0,0,0,0.4);
    }
    .char-shirt-print {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 30px;
        background: linear-gradient(90deg, transparent, rgba(255,80,80,0.9), transparent);
        clip-path: polygon(0 50%, 20% 0, 80% 0, 100% 50%, 80% 100%, 20% 100%);
    }
    .char-shirt-print::after {
        content: 'STUCK FOREVER';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 8px;
        font-weight: bold;
        font-family: 'Arial Black', sans-serif;
        letter-spacing: 1px;
        white-space: nowrap;
    }

    /* Шея */
    .char-neck {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 30px;
        background: linear-gradient(180deg, #e0b890 0%, #c8a080 100%);
        border-radius: 10px;
    }

    /* Голова */
    .char-head {
        position: absolute;
        top: -120px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 160px;
        background: linear-gradient(180deg, #f0c8a0 0%, #e0b890 100%);
        border-radius: 50% 50% 45% 45%;
        box-shadow: inset -15px -15px 30px rgba(0,0,0,0.1);
    }

    /* Волосы */
    .char-hair {
        position: absolute;
        top: -140px;
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 90px;
        background: linear-gradient(180deg, #3a2418 0%, #2a1810 100%);
        border-radius: 75px 75px 0 0;
        box-shadow: inset 0 -10px 20px rgba(0,0,0,0.3);
    }
    .char-hair::after {
        content: '';
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        height: 40px;
        background: linear-gradient(180deg, #2a1810 0%, transparent 100%);
        clip-path: polygon(0 0, 15% 100%, 30% 20%, 50% 90%, 70% 20%, 85% 100%, 100% 0);
    }

    /* Глаза */
    .char-eye {
        position: absolute;
        top: 30px;
        width: 30px;
        height: 20px;
        background: #1a1a1a;
        border-radius: 50%;
    }
    .char-eye.left { left: 25px; }
    .char-eye.right { right: 25px; }
    .char-eye::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 5px;
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
    }

    /* Очки */
    .char-glasses {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 45px;
    }
    .char-glass {
        position: absolute;
        top: 0;
        width: 50px;
        height: 45px;
        border: 3px solid #1a1a1a;
        border-radius: 8px;
        background: rgba(200,220,255,0.15);
    }
    .char-glass.left { left: 0; }
    .char-glass.right { right: 0; }
    .char-glass-bridge {
        position: absolute;
        top: 20px;
        left: 50px;
        width: 20px;
        height: 3px;
        background: #1a1a1a;
    }

    /* Рот */
    .char-mouth {
        position: absolute;
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        width: 20px;
        height: 3px;
        background: #8a4030;
        border-radius: 2px;
        transition: all 0.3s;
    }
    .char-mouth.smile {
        height: 15px;
        width: 40px;
        border-radius: 0 0 40px 40px;
        background: #8a4030;
    }
    .char-mouth.sad {
        height: 8px;
        width: 30px;
        border-radius: 40px 40px 0 0;
        background: #8a4030;
    }

    /* ===== ДИАЛОГОВОЕ ОКНО ===== */
    #dialogue-box {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 260px;
        background: linear-gradient(180deg, rgba(10,5,20,0.5) 0%, rgba(5,2,12,0.95) 30%, rgba(5,2,12,0.98) 100%);
        backdrop-filter: blur(8px);
        border-top: 3px solid rgba(255,200,120,0.3);
        z-index: 10;
        padding: 30px 60px;
        display: flex;
        flex-direction: column;
    }

    #speaker {
        display: inline-block;
        padding: 6px 20px;
        background: linear-gradient(180deg, #ffd966 0%, #d4a040 100%);
        color: #1a0a15;
        font-weight: bold;
        font-size: 16px;
        border-radius: 6px 6px 0 0;
        margin-bottom: -3px;
        box-shadow: 0 -4px 15px rgba(255,200,100,0.4);
        font-family: 'Georgia', serif;
        letter-spacing: 1px;
    }

    #dialogue-text {
        flex: 1;
        font-size: 19px;
        line-height: 1.7;
        color: #f0e8e0;
        text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        overflow-y: auto;
        padding: 8px 0;
        min-height: 100px;
    }

    #dialogue-text::-webkit-scrollbar { width: 4px; }
    #dialogue-text::-webkit-scrollbar-thumb { background: rgba(255,200,120,0.3); border-radius: 2px; }

    #continue-hint {
        text-align: right;
        font-size: 13px;
        color: rgba(255,200,120,0.7);
        animation: blink 1.5s infinite;
        font-style: italic;
    }
    @keyframes blink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
    }

    /* ===== ВЫБОР ===== */
    #choices {
        position: absolute;
        bottom: 280px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 15;
        width: 600px;
    }

    .choice-btn {
        padding: 16px 30px;
        background: linear-gradient(90deg, rgba(40,20,60,0.9) 0%, rgba(60,30,90,0.9) 50%, rgba(40,20,60,0.9) 100%);
        border: 2px solid rgba(255,200,120,0.5);
        color: #f0e8e0;
        font-size: 17px;
        font-family: 'Georgia', serif;
        cursor: pointer;
        transition: all 0.25s;
        text-align: center;
        border-radius: 8px;
        position: relative;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .choice-btn:hover {
        background: linear-gradient(90deg, rgba(255,200,120,0.15) 0%, rgba(255,200,120,0.3) 50%, rgba(255,200,120,0.15) 100%);
        border-color: #ffd966;
        transform: translateX(10px);
        box-shadow: 0 8px 30px rgba(255,200,120,0.4);
    }
    .choice-btn::before {
        content: '▶';
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #ffd966;
        opacity: 0;
        transition: 0.25s;
    }
    .choice-btn:hover::before { opacity: 1; }

    /* ===== ЗАГОЛОВОК ГЛАВЫ ===== */
    #chapter-title {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        font-size: 72px;
        color: #ffd966;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 40px rgba(255,200,120,0.8), 0 10px 30px rgba(0,0,0,0.9);
        opacity: 0;
        pointer-events: none;
        transition: all 1.5s;
        letter-spacing: 8px;
        z-index: 100;
        text-align: center;
    }
    #chapter-title.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    #chapter-title small {
        display: block;
        font-size: 22px;
        letter-spacing: 4px;
        color: #ffb86c;
        margin-top: 10px;
        opacity: 0.8;
    }

    /* ===== HUD ===== */
    #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 20;
        padding: 14px 18px;
        background: rgba(5,2,12,0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,200,120,0.3);
        border-radius: 10px;
        min-width: 220px;
    }
    #hud-title {
        font-size: 12px;
        color: #ffd966;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
        font-family: 'Georgia', serif;
    }
    .hud-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #d0c0e0;
    }
    .hud-icon { font-size: 15px; width: 20px; text-align: center; }
    .hud-bar {
        flex: 1;
        height: 8px;
        background: rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
    }
    .hud-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.5s;
    }

    /* Атмосферная виньетка */
    #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
        z-index: 3;
    }

    /* Частицы пыли */
    .dust {
        position: absolute;
        width: 3px;
        height: 3px;
        background: rgba(255,220,150,0.5);
        border-radius: 50%;
        pointer-events: none;
        animation: float 8s linear infinite;
        z-index: 4;
    }
    @keyframes float {
        0% { transform: translate(0, 0) scale(1); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translate(80px, -100vh) scale(0.5); opacity: 0; }
    }

    /* Меню старта */
    #start-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #1a0a15 0%, #0a0510 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 1s;
    }
    #start-screen.hide { opacity: 0; pointer-events: none; }

    #start-title {
        font-size: 78px;
        color: #ffd966;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 40px rgba(255,200,120,0.6);
        letter-spacing: 6px;
        margin-bottom: 20px;
        text-align: center;
        animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
    }
    #start-subtitle {
        font-size: 20px;
        color: #d0a060;
        font-style: italic;
        margin-bottom: 60px;
        letter-spacing: 3px;
    }
    #start-btn {
        padding: 20px 70px;
        font-size: 20px;
        background: linear-gradient(180deg, #ffd966 0%, #d4a040 100%);
        color: #1a0a15;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: 'Georgia', serif;
        font-weight: bold;
        letter-spacing: 3px;
        transition: all 0.3s;
        box-shadow: 0 0 40px rgba(255,200,120,0.4);
    }
    #start-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 60px rgba(255,200,120,0.8);
    }

    #start-hint {
        margin-top: 40px;
        color: #6a5060;
        font-size: 13px;
        font-style: italic;
    }

    /* Финальный экран */
    #end-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, #2a1a2e 0%, #0a0510 100%);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 40px;
        text-align: center;
    }
    #end-screen.show { display: flex; animation: fadeIn 2s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #end-title {
        font-size: 60px;
        color: #ffd966;
        margin-bottom: 30px;
        letter-spacing: 8px;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 60px rgba(255,200,120,0.6);
    }
    #end-text {
        font-size: 22px;
        color: #d0c0e0;
        max-width: 700px;
        line-height: 1.8;
        font-style: italic;
        margin-bottom: 40px;
    }
    #end-restart {
        padding: 16px 50px;
        font-size: 16px;
        background: transparent;
        color: #ffd966;
        border: 2px solid #ffd966;
        border-radius: 8px;
        cursor: pointer;
        font-family: 'Georgia', serif;
        letter-spacing: 2px;
        transition: 0.3s;
    }
    #end-restart:hover {
        background: #ffd966;
        color: #1a0a15;
    }

    @media (max-width: 900px) {
        #dialogue-box { height: 220px; padding: 20px 30px; }
        #dialogue-text { font-size: 16px; }
        #choices { width: 90%; bottom: 240px; }
        #speaker { font-size: 14px; }
        #chapter-title { font-size: 44px; }
        #start-title { font-size: 48px; }
    }
</style>
</head>
<body>

<!-- СТАРТОВЫЙ ЭКРАН -->
<div id="start-screen">
    <div id="start-title">ИБРАГИМ</div>
    <div id="start-subtitle">～ Бесконечная дорога ～</div>
    <button id="start-btn" onclick="startGame()">НАЧАТЬ</button>
    <div id="start-hint">Визуальная новелла · 5 глав · 3 концовки</div>
</div>

<!-- ИГРА -->
<div id="game">

    <!-- ФОНЫ -->
    <div class="bg bg-road active" id="bg-road"></div>
    <div class="bg bg-room" id="bg-room"></div>
    <div class="bg bg-warehouse" id="bg-warehouse"></div>
    <div class="bg bg-night" id="bg-night"></div>

    <!-- ВИНЬЕТКА -->
    <div id="vignette"></div>

    <!-- СПРАЙТ ИБРАГИМА -->
    <div id="ibrahim">
        <div class="char">
            <div class="char-hair"></div>
            <div class="char-head">
                <div class="char-glasses">
                    <div class="char-glass left"></div>
                    <div class="char-glass right"></div>
                    <div class="char-glass-bridge"></div>
                </div>
                <div class="char-eye left"></div>
                <div class="char-eye right"></div>
                <div class="char-mouth" id="mouth"></div>
            </div>
            <div class="char-neck"></div>
            <div class="char-body">
                <div class="char-shirt-print"></div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="hud-title">СОСТОЯНИЕ</div>
        <div class="hud-row"><span class="hud-icon">🍔</span><div class="hud-bar"><div class="hud-fill" id="h-food" style="background:#ff6b6b;width:70%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">😴</span><div class="hud-bar"><div class="hud-fill" id="h-sleep" style="background:#4dabf7;width:75%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">🚬</span><div class="hud-bar"><div class="hud-fill" id="h-nicotine" style="background:#adb5bd;width:60%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">🍺</span><div class="hud-bar"><div class="hud-fill" id="h-cider" style="background:#ffa94d;width:50%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">🕌</span><div class="hud-bar"><div class="hud-fill" id="h-faith" style="background:#b197fc;width:80%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">✨</span><div class="hud-bar"><div class="hud-fill" id="h-mood" style="background:#ffd43b;width:70%"></div></div></div>
    </div>

    <!-- ЗАГОЛОВОК ГЛАВЫ -->
    <div id="chapter-title"></div>

    <!-- ВЫБОРЫ -->
    <div id="choices"></div>

    <!-- ДИАЛОГ -->
    <div id="dialogue-box">
        <div id="speaker">Ибрагим</div>
        <div id="dialogue-text">...</div>
        <div id="continue-hint">▼ Нажми, чтобы продолжить</div>
    </div>

</div>

<!-- ФИНАЛ -->
<div id="end-screen">
    <div id="end-title">КОНЕЦ</div>
    <div id="end-text"></div>
    <button id="end-restart" onclick="location.reload()">СНАЧАЛА</button>
</div>

<script>
// ============================================================
// ИБРАГИМ — Бесконечная дорога
// Визуальная новелла
// ============================================================

// ==== СОСТОЯНИЕ ====
const state = {
    needs: {
        food: 70,
        sleep: 75,
        nicotine: 60,
        cider: 50,
        faith: 80,
        mood: 70
    },
    choices: {}, // история выборов
    flags: {},   // флаги
    currentScene: null,
    sceneIndex: 0,
    isTyping: false,
    typingTimer: null
};

// ==== СЦЕНАРИЙ ====
const script = {

    // ============ ПРОЛОГ ============
    prologue: {
        bg: 'road',
        title: 'Пролог',
        subtitle: '～ Утро ～',
        lines: [
            { speaker: '...', text: 'Утро. Дорога. Туман над асфальтом.', mood: 'sad' },

// ============================================================
// ЛОГИКА
// ============================================================

let currentScene = null;
let currentLine = 0;
let isTyping = false;
let typingTimer = null;

function startGame() {
    document.getElementById('start-screen').classList.add('hide');
    setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        goToScene('prologue');
    }, 800);
}

function goToScene(sceneId) {
    const scene = script[sceneId];
    if (!scene) return;

    currentScene = sceneId;
    currentLine = 0;

    // Фон
    document.querySelectorAll('.bg').forEach(b => b.classList.remove('active'));
    const bgEl = document.getElementById('bg-' + scene.bg);
    if (bgEl) bgEl.classList.add('active');

    // Заголовок главы
    if (scene.title) {
        showChapterTitle(scene.title, scene.subtitle);
    }

    // Мысли скрыть/показать
    if (scene.choices && scene.choices.length > 0 && currentLine === 0 && !scene.title) {
        // покажем после линий
    }

    // Начинаем с первой строки
    showLine();
}

function showChapterTitle(title, subtitle) {
    const el = document.getElementById('chapter-title');
    el.innerHTML = title + (subtitle ? '<small>' + subtitle + '</small>' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
}

function showLine() {
    const scene = script[currentScene];

    // Если строки кончились → показываем выборы
    if (currentLine >= scene.lines.length) {
        showChoices();
        return;
    }

    const line = scene.lines[currentLine];

    // Спикер
    document.getElementById('speaker').textContent = line.speaker || '...';

    // Настроение — меняем рот
    const mouth = document.getElementById('mouth');
    mouth.className = 'char-mouth';
    if (line.mood === 'happy') mouth.classList.add('smile');
    if (line.mood === 'sad') mouth.classList.add('sad');

    // Печатаем текст
    typeText(line.text);
}

function typeText(text) {
    const el = document.getElementById('dialogue-text');
    el.textContent = '';
    isTyping = true;
    let i = 0;

    clearInterval(typingTimer);
    typingTimer = setInterval(() => {
        if (i < text.length) {
            el.textContent += text[i];
            i++;
        } else {
            clearInterval(typingTimer);
            isTyping = false;
        }
    }, 28);
}

function nextLine() {
    if (isTyping) {
        // Пропустить анимацию
        clearInterval(typingTimer);
        const scene = script[currentScene];
        document.getElementById('dialogue-text').textContent = scene.lines[currentLine].text;
        isTyping = false;
        return;
    }
    currentLine++;
    showLine();
}

function showChoices() {
    const scene = script[currentScene];
    const el = document.getElementById('choices');
    el.innerHTML = '';

    // Если это финал — сразу к концовке
    if (scene.type === 'ending') {
        showEnding();
        return;
    }

    // Если есть только один выбор "..." — просто продолжаем
    if (scene.choices && scene.choices.length === 1 && scene.choices[0].text === '...') {
        goToScene(scene.choices[0].next);
        return;
    }

    scene.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.onclick = () => {
            state.choices[currentScene] = choice.text;

            // Применяем изменения потребностей если есть
            if (choice.needs) {
                for (const k in choice.needs) {
                    if (state.needs[k] !== undefined) {
                        state.needs[k] = Math.max(0, Math.min(100, state.needs[k] + choice.needs[k]));
                    }
                }
            }
            if (choice.flags) {
                Object.assign(state.flags, choice.flags);
            }

            updateHUD();
            goToScene(choice.next);
        };
        el.appendChild(btn);
    });
}

function updateHUD() {
    document.getElementById('h-food').style.width = state.needs.food + '%';
    document.getElementById('h-sleep').style.width = state.needs.sleep + '%';
    document.getElementById('h-nicotine').style.width = state.needs.nicotine + '%';
    document.getElementById('h-cider').style.width = state.needs.cider + '%';
    document.getElementById('h-faith').style.width = state.needs.faith + '%';
    document.getElementById('h-mood').style.width = state.needs.mood + '%';
}

function showEnding() {
    // Определяем концовку по флагам и потребностям
    let endingTitle = 'КОНЕЦ';
    let endingText = '';

    const avgMood = (state.needs.mood + state.needs.faith) / 2;

    if (state.flags.hopeful && state.flags.prayed && avgMood > 70) {
        endingTitle = '～ Светлая дорога ～';
        endingText = 'Ибрагим нашёл в себе силы. Вера, надежда, и что-то большее. Он не сдался. Он идёт вперёд — и этот путь только начинается.';
    } else if (state.flags.warning && state.needs.mood < 40) {
        endingTitle = '～ Туман ～';
        endingText = 'Ибрагим устал. Работа, дорога, одиночество. Всё слилось в один серый день. Но он дышит. И это значит — ещё не конец.';
    } else if (state.flags.called_mom && state.needs.mood > 60) {
        endingTitle = '～ Тёплый вечер ～';
        endingText = 'Голос мамы. Сидр на балконе. Закат над городом. Ибрагим понял: счастье — в мелочах. И он улыбнулся.';
    } else {
        endingTitle = '～ Бесконечная дорога ～';
        endingText = 'Утро. Дорога. Туман. Ибрагим стоит на обочине. Жизнь продолжается. И это — уже немало.';
    }

    document.getElementById('end-title').textContent = endingTitle;
    document.getElementById('end-text').textContent = endingText;
    document.getElementById('end-screen').classList.add('show');
}

// ============================================================
// УПРАВЛЕНИЕ
// ============================================================

document.getElementById('dialogue-box').addEventListener('click', nextLine);

document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (document.querySelectorAll('.choice-btn').length === 0) {
            nextLine();
        }
    }
});

// Пыль в воздухе
setInterval(() => {
    const dust = document.createElement('div');
    dust.className = 'dust';
    dust.style.left = Math.random() * 100 + '%';
    dust.style.top = '100%';
    dust.style.animationDuration = (5 + Math.random() * 8) + 's';
    document.getElementById('game').appendChild(dust);
    setTimeout(() => dust.remove(), 10000);
}, 800);

// Стартовая подсказка
setTimeout(() => {
    updateHUD();
}, 100);
