<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ибрагим — Бесконечная дорога</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: 'Georgia', 'Times New Roman', serif; background: #000; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    #game { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }

    #preloader {
        position: fixed; inset: 0;
        background: linear-gradient(180deg, #1a0a15 0%, #0a0510 100%);
        display: none; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 2000; transition: opacity 1s; padding: 20px;
    }
    #preloader.show { display: flex; }
    #preloader.hide { opacity: 0; pointer-events: none; }
    .preloader-title { font-size: 72px; color: #ffd966; font-family: 'Georgia', serif; letter-spacing: 14px; text-shadow: 0 0 60px rgba(255,200,120,0.7); margin-bottom: 16px; }
    .preloader-sub { font-size: 18px; color: #d0a060; font-style: italic; letter-spacing: 6px; margin-bottom: 60px; }
    .preloader-bar { width: 400px; max-width: 80vw; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,200,120,0.3); }
    .preloader-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd966, #d4a040); border-radius: 3px; transition: width 0.3s ease; box-shadow: 0 0 20px rgba(255,200,120,0.6); }
    .preloader-status { margin-top: 20px; font-size: 13px; color: #8a7060; letter-spacing: 3px; font-style: italic; }
    .preloader-failed { margin-top: 30px; max-width: 600px; max-height: 200px; overflow-y: auto; padding: 16px; background: rgba(220, 53, 69, 0.15); border: 1px solid rgba(220, 53, 69, 0.4); border-radius: 10px; font-size: 12px; color: #ff8a8a; line-height: 1.7; display: none; }
    .preloader-failed.show { display: block; }
    .preloader-failed-title { font-weight: bold; margin-bottom: 8px; color: #ff6b6b; }

    .bg-layer {
        position: absolute; inset: 0;
        background-size: cover; background-position: center; background-repeat: no-repeat;
        background-color: #0a0510;
        opacity: 0; transition: opacity 2s ease;
        z-index: 1;
    }
    .bg-layer.active { opacity: 1; animation: kenburns 60s ease-in-out infinite alternate; }
    @keyframes kenburns { 0% { transform: scale(1); } 100% { transform: scale(1.04); } }
    .bg-blur {
        position: absolute; inset: -20%;
        background-size: cover; background-position: center;
        filter: blur(80px) brightness(0.2) saturate(1.2);
        opacity: 0; transition: opacity 2s ease; z-index: 0;
    }
    .bg-blur.active { opacity: 1; }

    #chapter-dark { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; z-index: 90; }
    #chapter-dark.show { opacity: 0.9; }
    #silence-dark { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2s ease; z-index: 95; }
    #silence-dark.show { opacity: 1; }

    #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%); z-index: 3; }
    #gradient-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: linear-gradient(180deg, transparent 0%, rgba(5,2,12,0.75) 50%, rgba(5,2,12,0.98) 100%); pointer-events: none; z-index: 4; }

    #dialogue-box { position: absolute; bottom: 0; left: 0; right: 0; min-height: 300px; z-index: 10; padding: 30px 100px 45px; display: flex; flex-direction: column; cursor: pointer; transition: opacity 0.8s; }
    #speaker { display: inline-block; padding: 8px 28px; background: linear-gradient(180deg, rgba(255,217,102,0.95) 0%, rgba(212,160,64,0.95) 100%); color: #1a0a15; font-weight: bold; font-size: 15px; letter-spacing: 2px; border-radius: 6px 6px 0 0; align-self: flex-start; box-shadow: 0 -6px 30px rgba(255,200,100,0.5); }
    #dialogue-text { flex: 1; font-size: 19px; line-height: 1.95; color: #f2eae2; text-shadow: 0 2px 14px rgba(0,0,0,0.95); overflow-y: auto; padding: 16px 4px 0; min-height: 160px; font-style: italic; }
    #dialogue-text::-webkit-scrollbar { width: 4px; }
    #dialogue-text::-webkit-scrollbar-thumb { background: rgba(255,200,120,0.3); border-radius: 2px; }

    #continue-hint { text-align: right; font-size: 12px; color: rgba(255,200,120,0.6); animation: blink 1.8s infinite; margin-top: 12px; letter-spacing: 1px; }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }

    #choices { position: absolute; bottom: 320px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 14px; z-index: 15; width: 760px; max-width: 92vw; }
    .choice-btn { padding: 20px 42px; background: linear-gradient(90deg, rgba(30,15,45,0.95) 0%, rgba(50,25,75,0.95) 50%, rgba(30,15,45,0.95) 100%); border: 2px solid rgba(255,200,120,0.4); color: #f2eae2; font-size: 17px; font-family: 'Georgia', serif; font-style: italic; cursor: pointer; transition: all 0.4s; text-align: center; border-radius: 10px; box-shadow: 0 8px 35px rgba(0,0,0,0.7); position: relative; overflow: hidden; }
    .choice-btn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #ffd966; transform: scaleY(0); transition: transform 0.4s; }
    .choice-btn:active { background: linear-gradient(90deg, rgba(255,200,120,0.15) 0%, rgba(255,200,120,0.3) 50%, rgba(255,200,120,0.15) 100%); border-color: #ffd966; }

    #chapter-title { position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%) scale(0.7); color: #ffd966; font-family: 'Georgia', serif; text-shadow: 0 0 60px rgba(255,200,120,0.9), 0 15px 50px rgba(0,0,0,1); opacity: 0; pointer-events: none; transition: all 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); letter-spacing: 14px; z-index: 100; text-align: center; font-size: 72px; }
    #chapter-title.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #chapter-title small { display: block; font-size: 18px; letter-spacing: 8px; color: #ffb86c; margin-top: 22px; opacity: 0.85; font-style: italic; font-weight: normal; }

    .dust { position: absolute; width: 3px; height: 3px; background: rgba(255,220,150,0.5); border-radius: 50%; pointer-events: none; animation: float 12s linear infinite; z-index: 4; }
    @keyframes float { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translate(80px, -100vh) scale(0.5); opacity: 0; } }

    #start-screen { position: fixed; inset: 0; background: linear-gradient(180deg, #1a0a15 0%, #0a0510 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 2.5s; text-align: center; padding: 20px; }
    #start-screen.hide { opacity: 0; pointer-events: none; }
    #start-title { font-size: 92px; color: #ffd966; font-family: 'Georgia', serif; text-shadow: 0 0 80px rgba(255,200,120,0.8); letter-spacing: 18px; margin-bottom: 26px; }
    #start-subtitle { font-size: 22px; color: #d0a060; font-style: italic; margin-bottom: 85px; letter-spacing: 7px; }
    #start-btn { padding: 24px 90px; font-size: 20px; background: linear-gradient(180deg, #ffd966 0%, #d4a040 100%); color: #1a0a15; border: none; border-radius: 12px; cursor: pointer; font-family: 'Georgia', serif; font-weight: bold; letter-spacing: 5px; transition: all 0.4s; box-shadow: 0 0 60px rgba(255,200,120,0.6); }
    #start-btn:active { transform: scale(1.04); }
    #start-hint { margin-top: 60px; color: #6a5060; font-size: 13px; font-style: italic; letter-spacing: 2px; max-width: 600px; line-height: 1.9; }

    /* ===== ТИТРЫ ===== */
    #credits-screen {
        position: fixed; inset: 0;
        background: #000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1500;
        text-align: center;
        overflow: hidden;
    }
    #credits-screen.show { display: flex; }

    #credits-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #000;
    }
    .credits-bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        filter: brightness(0.35) contrast(1.1) saturate(1.1);
        transition: opacity 0.15s ease;
    }
    .credits-bg-photo.active { opacity: 1; }

    #credits-content {
        position: relative;
        z-index: 2;
        padding: 40px 20px;
        text-shadow: 0 0 60px rgba(0,0,0,0.95), 0 4px 30px rgba(0,0,0,1);
    }
    .credit-line {
        font-size: 14px;
        color: #c8a878;

    }
    .credit-name {
        font-size: 44px;
        color: #ffd966;
        font-family: 'Georgia', serif;
        letter-spacing: 10px;
        text-shadow: 0 0 60px rgba(255,200,120,0.9), 0 6px 40px rgba(0,0,0,1);
        margin-bottom: 60px;
    }

    /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */
    @media (max-width: 900px) {
        #dialogue-box {
            min-height: 220px;
            padding: 16px 20px 24px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
        }
        #speaker {
            font-size: 13px;
            padding: 6px 20px;
            letter-spacing: 1.5px;
        }
        #dialogue-text {
            font-size: 16px;
            line-height: 1.7;
            min-height: 120px;
            padding: 12px 2px 0;
        }
        #continue-hint {
            font-size: 11px;
            margin-top: 8px;
        }
        #choices {
            bottom: 240px;
            width: 94vw;
            gap: 10px;
        }
        .choice-btn {
            padding: 16px 20px;
            font-size: 15px;
            border-radius: 12px;
        }
        #chapter-title {
            font-size: 36px;
            letter-spacing: 6px;
            padding: 0 20px;
        }
        #chapter-title small {
            font-size: 14px;
            letter-spacing: 4px;
            margin-top: 14px;
        }
        #start-title {
            font-size: 52px;
            letter-spacing: 8px;
        }
        #start-subtitle {
            font-size: 16px;
            letter-spacing: 4px;
            margin-bottom: 50px;
        }
        #start-btn {
            padding: 20px 60px;
            font-size: 17px;
            letter-spacing: 4px;
        }
        #start-hint {
            font-size: 12px;
            margin-top: 40px;
        }
        .preloader-title { font-size: 44px; letter-spacing: 8px; }
        .preloader-sub { font-size: 14px; letter-spacing: 4px; margin-bottom: 40px; }
        .preloader-bar { width: 260px; }
        .credit-name { font-size: 26px; letter-spacing: 4px; margin-bottom: 30px; }
        .credit-line { font-size: 11px; letter-spacing: 3px; }
    }

    /* Маленькие телефоны в горизонтальной ориентации */
    @media (max-height: 500px) and (orientation: landscape) {
        #dialogue-box {
            min-height: 140px;
            padding: 10px 30px 14px;
        }
        #dialogue-text {
            font-size: 14px;
            min-height: 70px;
            line-height: 1.5;
        }
        #speaker { font-size: 12px; padding: 5px 16px; }
        #continue-hint { font-size: 10px; margin-top: 4px; }
        #choices {
            bottom: 150px;
            gap: 8px;
        }
        .choice-btn { padding: 10px 16px; font-size: 13px; }
        #chapter-title { font-size: 28px; letter-spacing: 4px; }
        #chapter-title small { font-size: 11px; letter-spacing: 2px; margin-top: 8px; }
        #start-title { font-size: 36px; letter-spacing: 6px; }
        #start-subtitle { font-size: 13px; letter-spacing: 3px; margin-bottom: 30px; }
        #start-btn { padding: 14px 44px; font-size: 14px; }
        #start-hint { font-size: 10px; margin-top: 20px; line-height: 1.6; }
        .credit-name { font-size: 20px; letter-spacing: 3px; margin-bottom: 16px; }
        .credit-line { font-size: 10px; letter-spacing: 2px; }
    }
</style>
</head>
<body>

<div id="preloader" class="show">
    <div class="preloader-title">ИБРАГИМ</div>
    <div class="preloader-sub">～ Загрузка ～</div>
    <div class="preloader-bar"><div class="preloader-bar-fill" id="preload-fill"></div></div>
    <div class="preloader-status" id="preload-status">0 / 0</div>
    <div class="preloader-failed" id="preload-failed">
        <div class="preloader-failed-title">⚠️ Файлы не найдены:</div>
        <div id="preload-failed-list"></div>
    </div>
</div>

<div id="start-screen">
    <div id="start-title">ИБРАГИМ</div>
    <div id="start-subtitle">～ Бесконечная дорога ～</div>
    <button id="start-btn" onclick="startGame()">НАЧАТЬ</button>
    <div id="start-hint">
        Это история о парне, который искал.<br>
        О парне, который терял и находил.<br>
        О дороге, у которой нет конца.
    </div>
</div>

<div id="game">
    <div class="bg-blur active" id="bg-blur"></div>
    <div class="bg-layer active" id="bg"></div>
    <div id="vignette"></div>
    <div id="gradient-bottom"></div>
    <div id="chapter-dark"></div>
    <div id="silence-dark"></div>

    <div id="chapter-title"></div>
    <div id="choices"></div>

    <div id="dialogue-box">
        <div id="speaker">...</div>
        <div id="dialogue-text">...</div>
        <div id="continue-hint">▼ тап · свайп · Enter</div>
    </div>
</div>

<div id="credits-screen">
    <div id="credits-bg"></div>
    <div id="credits-content">
        <div class="credit-line">Автор</div>
        <div class="credit-name">Хузиев Ильназ</div>
        <div class="credit-line">Главный герой</div>
        <div class="credit-name">Ибрагим Шакирьянов</div>
    </div>
</div>

<script>
const state = {
    inner: { faith: 70, pain: 20, mask: 40, lost: 30, hope: 60 },
    choices: {},
    flags: { pribit_count: 0 }
};

const ALL_PHOTOS = [
    'childhood.jpg',
    'dasha-time.jpg',
    'friends.jpg',
    'ibrahim 1.webp',
    'ibrahim-field.webp',
    'ibrahim-walk.jpg',
    'ilnaz.jpg',
    'ilnaz.png',
    'julia-dark.webp',
    'julia-end.jpg',
    'julia-izhevsk.jpg',
    'julia-time.jpg',
    'school.webp',
    'shinka.jpg',
    'smoke.jpg',
    'stroyka.jpg',
    'svetly.jpg'
];

let loadedCount = 0;
let failedImages = [];

function preloadAllImages() {
    return new Promise(resolve => {
        if (ALL_PHOTOS.length === 0) { resolve(); return; }
        let done = 0;
        ALL_PHOTOS.forEach(name => {
            const img = new Image();
            img.onload = () => { done++; loadedCount = done; updatePreloader(); if (done === ALL_PHOTOS.length) resolve(); };
            img.onerror = () => { failedImages.push(name); done++; loadedCount = done; updatePreloader(); if (done === ALL_PHOTOS.length) resolve(); };
            img.src = encodeURI(name);
        });
    });
}

function updatePreloader() {
    const total = ALL_PHOTOS.length;
    const percent = total > 0 ? Math.round((loadedCount / total) * 100) : 0;
    const fill = document.getElementById('preload-fill');
    const status = document.getElementById('preload-status');
    if (fill) fill.style.width = percent + '%';
    if (status) status.textContent = loadedCount + ' / ' + total;
    const failedBox = document.getElementById('preload-failed');
    const failedList = document.getElementById('preload-failed-list');
    if (failedBox && failedList && failedImages.length > 0) {
        failedBox.classList.add('show');
        failedList.innerHTML = failedImages.map(f => '• ' + f).join('<br>');
    }
}

// ============ АУДИО ============
let audioCtx = null;
let currentTimer = null;
let currentTheme = null;
let masterGain = null;

function initAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

const themes = {
    guitar_childhood: {
        notes: [196.00, 246.94, 293.66, 246.94, 196.00, 164.81, 196.00, 220.00,
                196.00, 246.94, 293.66, 329.63, 293.66, 246.94, 196.00],
        tempo: 1.6, vol: 0.055, style: 'finger'
    },
    guitar_warm: {
        notes: [130.81, 164.81, 196.00, 246.94, 196.00, 164.81, 130.81, 146.83],
        tempo: 1.7, vol: 0.05, style: 'finger'
    },
    guitar_forest: {
        notes: [146.83, 174.61, 220.00, 261.63, 220.00, 174.61, 146.83, 196.00],
        tempo: 2.0, vol: 0.05, style: 'finger'
    },
    guitar_friends: {
        notes: [196.00, 220.00, 246.94, 293.66, 246.94, 220.00, 196.00, 174.61],
        tempo: 1.4, vol: 0.055, style: 'strum'
    },
    guitar_happy: {
        notes: [261.63, 293.66, 329.63, 392.00, 329.63, 293.66, 261.63, 246.94],
        tempo: 1.2, vol: 0.06, style: 'strum'
    },
    guitar_lonely: {
        notes: [110.00, 146.83, 164.81, 196.00, 164.81, 146.83, 110.00],
        tempo: 2.6, vol: 0.04, style: 'finger'
    },
    guitar_sad: {
        notes: [98.00, 130.81, 146.83, 164.81, 146.83, 130.81, 98.00],
        tempo: 3.0, vol: 0.038, style: 'finger'
    },
    guitar_deep: {
        notes: [98.00, 123.47, 146.83, 174.61, 146.83, 123.47, 98.00],
        tempo: 2.8, vol: 0.045, style: 'finger'
    },
    guitar_dark: {
        notes: [82.41, 98.00, 110.00, 123.47, 110.00, 98.00, 82.41],
        tempo: 3.2, vol: 0.04, style: 'finger'
    },
    guitar_tragic: {
        notes: [73.42, 87.31, 98.00, 110.00, 98.00, 87.31, 73.42],
        tempo: 3.5, vol: 0.035, style: 'finger'
    },
    guitar_hope: {
        notes: [196.00, 246.94, 293.66, 392.00, 293.66, 246.94, 196.00, 220.00],
        tempo: 1.6, vol: 0.055, style: 'finger'
    },
    guitar_dawn: {
        notes: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63],
        tempo: 1.8, vol: 0.05, style: 'finger'
    }
};

function playGuitarNote(freq, tempo, vol, outputNode, style) {
    if (!audioCtx || !outputNode) return;
    try {
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        osc1.type = 'triangle';
        osc1.frequency.value = freq;
        const osc2 = audioCtx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = freq * 2;
        const osc3 = audioCtx.createOscillator();
        osc3.type = 'sine';
        osc3.frequency.value = freq * 1.5;

        const bufferSize = Math.floor(audioCtx.sampleRate * 0.04);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 4);
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 2400;
        filter.Q.value = 0.6;

        const gain = audioCtx.createGain();
        const gain2 = audioCtx.createGain();
        const gain3 = audioCtx.createGain();
        const noiseGain = audioCtx.createGain();

        gain2.gain.value = 0.35;
        gain3.gain.value = 0.15;
        noiseGain.gain.value = (style === 'strum') ? 0.25 : 0.15;

        const attack = 0.004;
        const decay = tempo * 1.6;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(vol, now + attack);
        gain.gain.exponentialRampToValueAtTime(vol * 0.6, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(vol * 0.25, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.001, now + decay);

        osc1.connect(filter);
        osc2.connect(gain2); gain2.connect(filter);
        osc3.connect(gain3); gain3.connect(filter);
        noise.connect(noiseGain); noiseGain.connect(filter);
        filter.connect(gain);
        gain.connect(outputNode);

        osc1.start(now); osc2.start(now); osc3.start(now); noise.start(now);
        osc1.stop(now + decay + 0.5);
        osc2.stop(now + decay + 0.5);
        osc3.stop(now + decay + 0.5);
    } catch(e) {}
}

function playTheme(themeName) {
    if (!audioCtx) return;
    if (currentTheme === themeName) return;

    if (masterGain) {
        const oldGain = masterGain;
        const fadeOut = setInterval(() => {
            if (oldGain.gain.value > 0.001) {
                oldGain.gain.value *= 0.85;
            } else {
                oldGain.gain.value = 0;
                clearInterval(fadeOut);
            }
        }, 40);
    }

    if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
    currentTheme = themeName;

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    const fadeIn = setInterval(() => {
        if (masterGain.gain.value < 0.99) {
            masterGain.gain.value += 0.05;
        } else {
            masterGain.gain.value = 1;
            clearInterval(fadeIn);
        }
    }, 60);

    const t = themes[themeName] || themes.guitar_warm;
    let idx = 0;

    function playNote() {
        if (currentTheme !== themeName) return;
        playGuitarNote(t.notes[idx % t.notes.length], t.tempo, t.vol, masterGain, t.style);
        idx++;
    }

    playNote();
    currentTimer = setInterval(() => {
        if (currentTheme !== themeName) { clearInterval(currentTimer); return; }
        playNote();
    }, t.tempo * 1000);
}

function stopTheme() {
    if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
    if (masterGain) {
        const oldGain = masterGain;
        const fadeOut = setInterval(() => {
            if (oldGain.gain.value > 0.001) {
                oldGain.gain.value *= 0.8;
            } else {
                oldGain.gain.value = 0;
                clearInterval(fadeOut);
            }
        }, 40);
    }
    currentTheme = null;
}

// ============ ДВИЖОК ============
let currentScene = null;
let currentLineIndex = 0;
let typingTimer = null;
let isTyping = false;

function startGame() {
    initAudio();
    const startScreen = document.getElementById('start-screen');
    startScreen.classList.add('hide');
    setTimeout(() => { startScreen.style.display = 'none'; }, 2500);
    setTimeout(() => { showScene('prologue'); }, 500);
}

function showScene(sceneName) {
    const scene = script[sceneName];
    if (!scene) { console.error('Сцена не найдена:', sceneName); return; }
    currentScene = sceneName;
    currentLineIndex = 0;

    if (scene.needs) { applyNeeds(scene.needs); }

    if (scene.bg) { setBackground(scene.bg); }
    if (scene.theme) { playTheme(scene.theme); }

    if (scene.title) {
        showChapterTitle(scene.title, scene.subtitle, () => {
            renderLine();
        });
    } else {
        document.getElementById('dialogue-box').style.opacity = '1';
        document.getElementById('dialogue-box').style.pointerEvents = 'auto';
        renderLine();
    }
}

function showChapterTitle(title, subtitle, callback) {
    const titleEl = document.getElementById('chapter-title');
    titleEl.innerHTML = title + (subtitle ? '<small>' + subtitle + '</small>' : '');
    titleEl.classList.add('show');
    const dark = document.getElementById('chapter-dark');
    dark.classList.add('show');
    const box = document.getElementById('dialogue-box');
    box.style.pointerEvents = 'none';
    box.style.opacity = '0';

    setTimeout(() => {
        titleEl.classList.remove('show');
        dark.classList.remove('show');
        setTimeout(() => {
            box.style.opacity = '1';
            box.style.pointerEvents = 'auto';
            callback();
        }, 1500);
    }, 4000);
}

function renderLine() {
    const scene = script[currentScene];
    if (!scene) return;

    if (currentLineIndex >= scene.lines.length) {
        showChoices();
        return;
    }

    const line = scene.lines[currentLineIndex];

    if (line.bg) { setBackground(line.bg); }
    if (line.theme) { playTheme(line.theme); }

    const speakerEl = document.getElementById('speaker');
    const textEl = document.getElementById('dialogue-text');

    speakerEl.textContent = line.speaker || '...';
    textEl.textContent = '';
    isTyping = true;

    let charIndex = 0;
    const fullText = line.text;
    clearInterval(typingTimer);

    typingTimer = setInterval(() => {
        if (charIndex < fullText.length) {
            textEl.textContent += fullText[charIndex];
            charIndex++;
        } else {
            clearInterval(typingTimer);
            isTyping = false;
        }
    }, 20);
}

function nextLine() {
    const scene = script[currentScene];
    if (!scene) return;

    if (isTyping) {
        clearInterval(typingTimer);
        const line = scene.lines[currentLineIndex];
        document.getElementById('dialogue-text').textContent = line.text;
        isTyping = false;
        return;
    }

    currentLineIndex++;
    if (currentLineIndex < scene.lines.length) {
        renderLine();
    } else {
        showChoices();
    }
}

function showChoices() {
    const scene = script[currentScene];
    if (!scene) return;

    if (scene.ending) { showEnding(scene); return; }
    if (!scene.choices || scene.choices.length === 0) return;

    const choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';

    scene.choices.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = ch.text;
        btn.onclick = (e) => { e.stopPropagation(); selectChoice(ch); };
        choicesEl.appendChild(btn);
    });
}

function selectChoice(choice) {
    document.getElementById('choices').innerHTML = '';

    if (choice.pribit) { state.flags.pribit_count++; }

    const needs = {};
    if (choice.faith) needs.faith = choice.faith;
    if (choice.pain) needs.pain = choice.pain;
    if (choice.mask) needs.mask = choice.mask;
    if (choice.lost) needs.lost = choice.lost;
    if (choice.hope) needs.hope = choice.hope;

    if (Object.keys(needs).length > 0) { applyNeeds(needs); }

    if (choice.next) { showScene(choice.next); }
}

function applyNeeds(needs) {
    for (const key in needs) {
        if (state.inner[key] !== undefined) {
            state.inner[key] = Math.max(0, Math.min(100, state.inner[key] + needs[key]));
        }
    }
}

function setBackground(bgName) {
    const bgEl = document.getElementById('bg');
    const blurEl = document.getElementById('bg-blur');
    const url = encodeURI(bgName);

    const img = new Image();
    img.onload = () => {
        bgEl.style.backgroundImage = 'url("' + url + '")';
        blurEl.style.backgroundImage = 'url("' + url + '")';
    };
    img.onerror = () => {
        bgEl.style.backgroundImage = 'none';
        blurEl.style.backgroundImage = 'none';
    };
    img.src = url;
}

// ============ ФИНАЛ → ТИТРЫ ============
function showEnding(scene) {
    document.getElementById('game').style.transition = 'opacity 3s ease';
    document.getElementById('game').style.opacity = '0';

    setTimeout(() => {
        startCredits();
    }, 3000);
}

function startCredits() {
    stopTheme();

    const credits = document.getElementById('credits-screen');
    credits.classList.add('show');

    startCreditsPhotoLoop();
    playCreditsMusic();
}

function startCreditsPhotoLoop() {
    const bgContainer = document.getElementById('credits-bg');
    const photoList = [
        'ibrahim-walk.jpg',
        'childhood.jpg',
        'julia-time.jpg',
        'friends.jpg',
        'ibrahim-field.webp',
        'julia-izhevsk.jpg',
        'ilnaz.jpg',
        'dasha-time.jpg',
        'julia-dark.webp',
        'julia-end.jpg',
        'stroyka.jpg',
        'svetly.jpg',
        'smoke.jpg',
        'shinka.jpg',
        'school.webp',
        'ibrahim 1.webp',
        'ilnaz.png'
    ];

    const imgs = photoList.map(src => {
        const img = document.createElement('img');
        img.className = 'credits-bg-photo';
        img.src = encodeURI(src);
        bgContainer.appendChild(img);
        return img;
    });

    let idx = 0;
    function showNext() {
        imgs.forEach(i => i.classList.remove('active'));
        imgs[idx].classList.add('active');
        idx = (idx + 1) % imgs.length;
    }

    showNext();
    setInterval(showNext, 900);
}

let creditsAudio = null;
function playCreditsMusic() {
    if (creditsAudio) return;
    try {
        creditsAudio = new Audio('Chernikovskaya_Hata_-_Spektakl_Okonchen_69749630.mp3');
        creditsAudio.volume = 0.0;
        creditsAudio.loop = false;

        const p = creditsAudio.play();
        if (p !== undefined) {
            p.then(() => {
                let vol = 0.0;
                const fadeIn = setInterval(() => {
                    if (vol < 0.35) {
                        vol += 0.01;
                        creditsAudio.volume = vol;
                    } else {
                        creditsAudio.volume = 0.35;
                        clearInterval(fadeIn);
                    }
                }, 200);
            }).catch(err => console.warn('Музыка не запустилась:', err));
        }
    } catch(e) {
        console.error('Ошибка аудио:', e);
    }
}

// ============ ОБРАБОТЧИКИ ============
// Клик для мыши
document.addEventListener('click', (e) => {
    if (e.target.closest('#choices')) return;
    if (e.target.closest('#dialogue-box')) {
        const box = document.getElementById('dialogue-box');
        if (box.style.pointerEvents === 'none') return;
        if (box.style.opacity === '0') return;
        nextLine();
    }
});

// Тач для телефона — быстрый тап без задержки
document.addEventListener('touchend', (e) => {
    if (e.target.closest('#choices')) return;
    if (e.target.closest('#dialogue-box')) {
        e.preventDefault();
        const box = document.getElementById('dialogue-box');
        if (box.style.pointerEvents === 'none') return;
        if (box.style.opacity === '0') return;
        nextLine();
    }
}, { passive: false });

// Клавиатура
document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        const box = document.getElementById('dialogue-box');
        if (box.style.pointerEvents === 'none') return;
        if (box.style.opacity === '0') return;
        nextLine();
    }
});

window.addEventListener('load', async () => {
    await preloadAllImages();
    setTimeout(() => {
        const preloader = document.getElementById('preloader');
        preloader.classList.add('hide');
        setTimeout(() => { preloader.classList.remove('show'); }, 1000);
    }, 800);
});

setInterval(() => {
    const dust = document.createElement('div');
    dust.className = 'dust';
    dust.style.left = Math.random() * 100 + '%';
    dust.style.bottom = '-10px';
    dust.style.animationDuration = (8 + Math.random() * 8) + 's';
    dust.style.animationDelay = Math.random() * 2 + 's';
    document.getElementById('game').appendChild(dust);
    setTimeout(() => dust.remove(), 20000);
}, 800);
</script>
