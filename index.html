<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ибрагим — Бесконечная дорога</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%; overflow: hidden;
        font-family: 'Georgia', 'Times New Roman', serif;
        background: #000; user-select: none;
    }
    #game { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

    /* ==== ПРЕДЗАГРУЗКА ==== */
    #preloader {
        position: fixed; inset: 0;
        background: linear-gradient(180deg, #1a0a15 0%, #0a0510 100%);
        display: none;
        flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 2000;
        transition: opacity 1s;
        padding: 20px;
    }
    #preloader.show { display: flex; }
    #preloader.hide { opacity: 0; pointer-events: none; }

    .preloader-title {
        font-size: 72px; color: #ffd966;
        font-family: 'Georgia', serif;
        letter-spacing: 14px;
        text-shadow: 0 0 60px rgba(255,200,120,0.7);
        margin-bottom: 16px;
        animation: titleGlow 4s ease-in-out infinite;
    }
    @keyframes titleGlow {
        0%, 100% { text-shadow: 0 0 60px rgba(255,200,120,0.7); }
        50% { text-shadow: 0 0 100px rgba(255,200,120,1); }
    }
    .preloader-sub {
        font-size: 18px; color: #d0a060;
        font-style: italic;
        letter-spacing: 6px;
        margin-bottom: 60px;
    }
    .preloader-bar {
        width: 400px; max-width: 80vw;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid rgba(255,200,120,0.3);
    }
    .preloader-bar-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #ffd966, #d4a040);
        border-radius: 3px;
        transition: width 0.3s ease;
        box-shadow: 0 0 20px rgba(255,200,120,0.6);
    }
    .preloader-status {
        margin-top: 20px;
        font-size: 13px;
        color: #8a7060;
        letter-spacing: 3px;
        font-style: italic;
    }
    .preloader-failed {
        margin-top: 30px;
        max-width: 600px;
        max-height: 200px;
        overflow-y: auto;
        padding: 16px;
        background: rgba(220, 53, 69, 0.15);
        border: 1px solid rgba(220, 53, 69, 0.4);
        border-radius: 10px;
        font-size: 12px;
        color: #ff8a8a;
        line-height: 1.7;
        display: none;
    }
    .preloader-failed.show { display: block; }
    .preloader-failed-title {
        font-weight: bold;
        margin-bottom: 8px;
        color: #ff6b6b;
        letter-spacing: 1px;
    }

    /* ==== ФОН ==== */
    .bg-layer {
        position: absolute; inset: -3%;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: opacity 2s ease;
        image-rendering: -webkit-optimize-contrast;
        backface-visibility: hidden;
        transform: translateZ(0);
    }
    .bg-layer.active {
        opacity: 1;
        animation: kenburns 45s ease-in-out infinite alternate;
    }
    @keyframes kenburns {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.15) translate(-2%, -2%); }
    }
    .bg-blur {
        position: absolute; inset: 0;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.35);
        opacity: 0;
        transition: opacity 2s ease;
        z-index: -1;
    }
    .bg-blur.active { opacity: 1; }

    #vignette {
        position: absolute; inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.9) 100%);
        z-index: 3;
    }
    #gradient-bottom {
        position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
        background: linear-gradient(180deg, transparent 0%, rgba(5,2,12,0.75) 50%, rgba(5,2,12,0.98) 100%);
        pointer-events: none; z-index: 4;
    }

    /* ==== ДИАЛОГ ==== */
    #dialogue-box {
        position: absolute; bottom: 0; left: 0; right: 0;
        min-height: 280px; z-index: 10;
        padding: 30px 90px 40px;
        display: flex; flex-direction: column;
        cursor: pointer;
    }
    #speaker {
        display: inline-block;
        padding: 8px 28px;
        background: linear-gradient(180deg, rgba(255,217,102,0.95) 0%, rgba(212,160,64,0.95) 100%);
        color: #1a0a15; font-weight: bold;
        font-size: 15px; letter-spacing: 2px;
        border-radius: 6px 6px 0 0;
        align-self: flex-start;
        box-shadow: 0 -6px 30px rgba(255,200,100,0.5);
    }
    #dialogue-text {
        flex: 1; font-size: 19px; line-height: 1.9;
        color: #f2eae2;
        text-shadow: 0 2px 14px rgba(0,0,0,0.95);
        overflow-y: auto; padding: 16px 4px 0;
        min-height: 140px;
        font-style: italic;
    }
    #dialogue-text::-webkit-scrollbar { width: 4px; }
    #dialogue-text::-webkit-scrollbar-thumb { background: rgba(255,200,120,0.3); border-radius: 2px; }

    #continue-hint {
        text-align: right; font-size: 12px;
        color: rgba(255,200,120,0.6);
        animation: blink 1.8s infinite;
        margin-top: 10px; letter-spacing: 1px;
    }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }

    /* ==== ВЫБОР ==== */
    #choices {
        position: absolute;
        bottom: 300px; left: 50%;
        transform: translateX(-50%);
        display: flex; flex-direction: column;
        gap: 14px; z-index: 15;
        width: 720px; max-width: 92vw;
    }
    .choice-btn {
        padding: 20px 40px;
        background: linear-gradient(90deg, rgba(30,15,45,0.95) 0%, rgba(50,25,75,0.95) 50%, rgba(30,15,45,0.95) 100%);
        border: 2px solid rgba(255,200,120,0.4);
        color: #f2eae2;
        font-size: 17px; font-family: 'Georgia', serif;
        font-style: italic;
        cursor: pointer;
        transition: all 0.4s;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 8px 35px rgba(0,0,0,0.7);
        position: relative;
        overflow: hidden;
    }
    .choice-btn::before {
        content: '';
        position: absolute; left: 0; top: 0; bottom: 0;
        width: 3px; background: #ffd966;
        transform: scaleY(0); transition: transform 0.4s;
    }
    .choice-btn:hover {
        background: linear-gradient(90deg, rgba(255,200,120,0.1) 0%, rgba(255,200,120,0.28) 50%, rgba(255,200,120,0.1) 100%);
        border-color: #ffd966;
        transform: translateY(-2px) translateX(8px);
        box-shadow: 0 14px 45px rgba(255,200,120,0.5);
    }
    .choice-btn:hover::before { transform: scaleY(1); }

    .choice-btn.pribit {
        background: linear-gradient(90deg, rgba(80,20,120,0.9) 0%, rgba(120,40,160,0.9) 50%, rgba(80,20,120,0.9) 100%);
        border-color: rgba(180,150,255,0.6);
    }
    .choice-btn.pribit:hover {
        background: linear-gradient(90deg, rgba(180,150,255,0.2) 0%, rgba(180,150,255,0.4) 50%, rgba(180,150,255,0.2) 100%);
        border-color: #b197fc;
        box-shadow: 0 14px 45px rgba(180,150,255,0.6);
    }
    .choice-btn.pribit::before { background: #b197fc; }

    /* ==== ЗАГОЛОВОК ГЛАВЫ ==== */
    #chapter-title {
        position: absolute; top: 42%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.7);
        color: #ffd966;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 60px rgba(255,200,120,0.9), 0 15px 50px rgba(0,0,0,1);
        opacity: 0; pointer-events: none;
        transition: all 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        letter-spacing: 14px; z-index: 100;
        text-align: center; font-size: 72px;
    }
    #chapter-title.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    #chapter-title small {
        display: block; font-size: 18px;
        letter-spacing: 8px; color: #ffb86c;
        margin-top: 22px; opacity: 0.85;
        font-style: italic; font-weight: normal;
    }

    /* ==== HUD ==== */
    #hud {
        position: absolute; top: 20px; left: 20px;
        display: flex; flex-direction: column; gap: 10px;
        z-index: 20; padding: 16px 20px;
        background: rgba(5,2,12,0.7);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,200,120,0.25);
        border-radius: 14px;
        min-width: 270px;
    }
    #hud-title {
        font-size: 10px; color: #ffd966;
        letter-spacing: 4px; text-transform: uppercase;
        margin-bottom: 10px; opacity: 0.8;
    }
    .hud-row {
        display: flex; align-items: center; gap: 12px;
        font-size: 11px; color: #d0c0e0;
    }
    .hud-label {
        width: 105px; font-size: 11px;
        letter-spacing: 0.4px; opacity: 0.85;
        font-style: italic;
    }
    .hud-bar {
        flex: 1; height: 6px;
        background: rgba(0,0,0,0.6);
        border-radius: 3px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
    }
    .hud-fill {
        height: 100%; border-radius: 3px;
        transition: width 1.2s ease;
    }
    .fill-faith { background: linear-gradient(90deg, #b197fc, #d0bfff); }
    .fill-pain { background: linear-gradient(90deg, #ff6b6b, #ff8787); }
    .fill-mask { background: linear-gradient(90deg, #adb5bd, #ced4da); }
    .fill-lost { background: linear-gradient(90deg, #748ffc, #91a7ff); }
    .fill-hope { background: linear-gradient(90deg, #ffd43b, #ffec99); }

    /* ==== ЭФФЕКТ ПРОБИТЬ СУДЬБУ ==== */
    #pribit-overlay {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, rgba(180,150,255,0.4) 0%, rgba(80,20,120,0.9) 100%);
        opacity: 0; pointer-events: none;
        z-index: 50;
        transition: opacity 0.8s;
    }
    #pribit-overlay.show { opacity: 1; }

    /* Частицы */
    .dust {
        position: absolute; width: 3px; height: 3px;
        background: rgba(255,220,150,0.5);
        border-radius: 50%; pointer-events: none;
        animation: float 12s linear infinite;
        z-index: 4;
    }
    @keyframes float {
        0% { transform: translate(0, 0) scale(1); opacity: 0; }
        10% { opacity: 0.7; }
        90% { opacity: 0.7; }
        100% { transform: translate(80px, -100vh) scale(0.5); opacity: 0; }
    }

    /* ==== СТАРТ ==== */
    #start-screen {
        position: fixed; inset: 0;
        background: linear-gradient(180deg, #1a0a15 0%, #0a0510 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 1000; transition: opacity 2.5s;
        text-align: center; padding: 20px;
    }
    #start-screen.hide { opacity: 0; pointer-events: none; }
    #start-title {
        font-size: 92px; color: #ffd966;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 80px rgba(255,200,120,0.8);
        letter-spacing: 18px; margin-bottom: 26px;
        animation: titleGlow 5s ease-in-out infinite;
    }
    #start-subtitle {
        font-size: 22px; color: #d0a060;
        font-style: italic; margin-bottom: 85px;
        letter-spacing: 7px;
    }
    #start-btn {
        padding: 24px 90px; font-size: 20px;
        background: linear-gradient(180deg, #ffd966 0%, #d4a040 100%);
        color: #1a0a15; border: none; border-radius: 12px;
        cursor: pointer; font-family: 'Georgia', serif;
        font-weight: bold; letter-spacing: 5px;
        transition: all 0.4s;
        box-shadow: 0 0 60px rgba(255,200,120,0.6);
    }
    #start-btn:hover {
        transform: scale(1.06);
        box-shadow: 0 0 100px rgba(255,200,120,1);
    }
    #start-hint {
        margin-top: 60px; color: #6a5060;
        font-size: 13px; font-style: italic;
        letter-spacing: 2px; max-width: 600px;
        line-height: 1.9;
    }

    /* ==== ФИНАЛ ==== */
    #end-screen {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at center, #2a1a2e 0%, #0a0510 100%);
        display: none; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 999; padding: 40px; text-align: center;
    }
    #end-screen.show { display: flex; animation: fadeIn 5s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #end-title {
        font-size: 62px; color: #ffd966;
        margin-bottom: 50px; letter-spacing: 14px;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 80px rgba(255,200,120,0.8);
        opacity: 0;
        animation: fadeInText 3s 1s forwards;
    }
    @keyframes fadeInText {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    #end-text {
        font-size: 22px; color: #d0c0e0;
        max-width: 850px; line-height: 2.1;
        font-style: italic; margin-bottom: 60px;
        opacity: 0;
        animation: fadeInText 3s 2.5s forwards;
    }
    #end-quote {
        font-size: 24px; color: #ffd966;
        max-width: 800px; line-height: 1.9;
        font-family: 'Georgia', serif;
        margin-bottom: 60px; padding: 30px 40px;
        border-left: 3px solid #ffd966;
        border-right: 3px solid #ffd966;
        opacity: 0;
        animation: fadeInText 4s 5s forwards;
    }
    #end-restart {
        padding: 18px 65px; font-size: 15px;
        background: transparent; color: #ffd966;
        border: 2px solid #ffd966; border-radius: 10px;
        cursor: pointer; font-family: 'Georgia', serif;
        letter-spacing: 4px; transition: 0.4s;
        opacity: 0;
        animation: fadeInText 3s 8s forwards;
    }
    #end-restart:hover { background: #ffd966; color: #1a0a15; }

    @media (max-width: 900px) {
        #dialogue-box { min-height: 230px; padding: 20px 30px 30px; }
        #dialogue-text { font-size: 16px; }
        #choices { width: 92%; bottom: 250px; }
        #chapter-title { font-size: 42px; letter-spacing: 6px; }
        #start-title { font-size: 52px; letter-spacing: 8px; }
        #hud { min-width: 200px; padding: 12px 14px; }
        .hud-label { width: 80px; font-size: 10px; }
    }
</style>
</head>
<body>

<!-- ПРЕДЗАГРУЗКА -->
<div id="preloader" class="show">
    <div class="preloader-title">ИБРАГИМ</div>
    <div class="preloader-sub">～ Загрузка ～</div>
    <div class="preloader-bar"><div class="preloader-bar-fill" id="preload-fill"></div></div>
    <div class="preloader-status" id="preload-status">0 / 0</div>
    <div class="preloader-failed" id="preload-failed">
        <div class="preloader-failed-title">⚠️ Файлы не найдены:</div>
        <div id="preload-failed-list"></div>
    </div>
</div>

<!-- СТАРТ -->
<div id="start-screen">
    <div id="start-title">ИБРАГИМ</div>
    <div id="start-subtitle">～ Бесконечная дорога ～</div>
    <button id="start-btn" onclick="startGame()">НАЧАТЬ</button>
    <div id="start-hint">
        Это история о парне, который искал Бога.<br>
        О парне, который терял и находил.<br>
        О дороге, у которой нет конца.
    </div>
</div>

<!-- ИГРА -->
<div id="game">
    <div class="bg-blur active" id="bg-blur"></div>
    <div class="bg-layer active" id="bg"></div>
    <div id="vignette"></div>
    <div id="gradient-bottom"></div>
    <div id="pribit-overlay"></div>

    <div id="hud">
        <div id="hud-title">ВНУТРЕННИЙ МИР</div>
        <div class="hud-row"><span class="hud-label">🕯️ Вера</span><div class="hud-bar"><div class="hud-fill fill-faith" id="h-faith" style="width:50%"></div></div></div>
        <div class="hud-row"><span class="hud-label">💔 Боль</span><div class="hud-bar"><div class="hud-fill fill-pain" id="h-pain" style="width:20%"></div></div></div>
        <div class="hud-row"><span class="hud-label">🎭 Маска</span><div class="hud-bar"><div class="hud-fill fill-mask" id="h-mask" style="width:40%"></div></div></div>
        <div class="hud-row"><span class="hud-label">🌫️ Потерянность</span><div class="hud-bar"><div class="hud-fill fill-lost" id="h-lost" style="width:30%"></div></div></div>
        <div class="hud-row"><span class="hud-label">🌱 Надежда</span><div class="hud-bar"><div class="hud-fill fill-hope" id="h-hope" style="width:60%"></div></div></div>
    </div>

    <div id="chapter-title"></div>
    <div id="choices"></div>

    <div id="dialogue-box" onclick="nextLine()">
        <div id="speaker">...</div>
        <div id="dialogue-text">...</div>
        <div id="continue-hint">▼ клик · пробел · Enter</div>
    </div>
</div>

<div id="end-screen">
    <div id="end-title">КОНЕЦ</div>
    <div id="end-text"></div>
    <div id="end-quote"></div>
    <button id="end-restart" onclick="location.reload()">НАЧАТЬ СНОВА</button>
</div>

<script>
// ============================================================
// ИБРАГИМ — Бесконечная дорога
// ============================================================

const state = {
    inner: { faith: 50, pain: 20, mask: 40, lost: 30, hope: 60 },
    choices: {},
    flags: { pribit_count: 0 }
};

// ============================================================
// СПИСОК ВСЕХ ФОТО — ПРОВЕРЬ ИМЕНА ТОЧНО КАК В ПАПКЕ!
// ============================================================
const ALL_PHOTOS = [
    'Детство Ижевск.jpg',
    'Ижевск с Юлей.jpg',
    'Встреча с Ильназом.jpg',
    'Школьные времена.png',
    'Время с Дашей.jpg',
    'Веселые времена с Юлей после Даши.jpg',
    'Стройка.jpg',
    'Юля готовится к смерти.webp',
    'Ибрагим курит в поле.jpg.webp',
    'Ибрагим поход.jpg',
    'Закуривает.jpg',
    'Поход с друзьями.jpg',
    'ЖК Светлый.jpg',
    'Шинка.jpg',
    'bratia.jpg',
    'dasha.jpg',
    'hushed.png',
    'ishevsk.jpg',
    'stroika.jpg',
    'svetlyu.jpg',
    'ulya.jpg',
    'ulya2.webp',
    'ulya3.jpg'
];

let loadedCount = 0;
let failedImages = [];

function preloadAllImages() {
    return new Promise(resolve => {
        if (ALL_PHOTOS.length === 0) { resolve(); return; }
        let done = 0;
        ALL_PHOTOS.forEach(name => {
            const img = new Image();
            img.onload = () => {
                done++;
                loadedCount = done;
                updatePreloader();
                if (done === ALL_PHOTOS.length) resolve();
            };
            img.onerror = () => {
                failedImages.push(name);
                done++;
                loadedCount = done;
                updatePreloader();
                if (done === ALL_PHOTOS.length) resolve();
            };
            img.src = encodeURI(name);
        });
    });
}

function updatePreloader() {
    const total = ALL_PHOTOS.length;
    const done = loadedCount;
    const percent = total > 0 ? Math.round((done / total) * 100) : 0;
    const fill = document.getElementById('preload-fill');
    const status = document.getElementById('preload-status');
    if (fill) fill.style.width = percent + '%';
    if (status) status.textContent = done + ' / ' + total;

    const failedBox = document.getElementById('preload-failed');
    const failedList = document.getElementById('preload-failed-list');
    if (failedBox && failedList && failedImages.length > 0) {
        failedBox.classList.add('show');
        failedList.innerHTML = failedImages.map(f => '• ' + f).join('<br>');
    }
}

// ============================================================
// МУЗЫКА
// ============================================================
let audioCtx = null;
let musicTimers = [];
let currentTheme = null;

function initAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

const themes = {
    childhood: { notes: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63], tempo: 1.4, type: 'sine', vol: 0.05 },
    melancholy: { notes: [146.83, 174.61, 220.00, 174.61], tempo: 2.6, type: 'triangle', vol: 0.045 },
    love: { notes: [261.63, 329.63, 392.00, 493.88, 440.00, 392.00], tempo: 1.8, type: 'sine', vol: 0.055 },
    empty: { notes: [110.00, 130.81, 146.83], tempo: 3.8, type: 'sine', vol: 0.04 },
    hope: { notes: [293.66, 369.99, 440.00, 587.33, 440.00, 369.99], tempo: 1.5, type: 'sine', vol: 0.06 },
    dread: { notes: [82.41, 98.00, 116.54], tempo: 4.2, type: 'sawtooth', vol: 0.03 },
    insight: { notes: [523.25, 659.25, 783.99, 1046.50], tempo: 1.2, type: 'sine', vol: 0.07 }
};

function playTheme(themeName) {
    if (!audioCtx) return;
    stopTheme();
    currentTheme = themeName;
    const t = themes[themeName] || themes.melancholy;
    let idx = 0;

    function playNote() {
        if (currentTheme !== themeName) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = t.type;
            osc.frequency.value = t.notes[idx % t.notes.length];
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(t.vol, audioCtx.currentTime + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t.tempo * 1.7);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + t.tempo * 1.9);
            idx++;
        } catch(e) {}
    }

    playNote();
    const timer = setInterval(() => {
        if (currentTheme !== themeName) { clearInterval(timer); return; }
        playNote();
    }, t.tempo * 1000);
    musicTimers.push(timer);
}

function stopTheme() {
    musicTimers.forEach(t => clearInterval(t));
    musicTimers = [];
    currentTheme = null;
}

// ============================================================
// ЛОГИКА
// ============================================================
let currentScene = null;
let currentLine = 0;
let isTyping = false;
let typingTimer = null;
let pribitUsed = {};

function startGame() {
    initAudio();
    document.getElementById('start-screen').classList.add('hide');
    setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        goToScene('prologue');
    }, 1200);
}

function setBackground(filename) {
    const bgEl = document.getElementById('bg');
    const bgBlur = document.getElementById('bg-blur');
    const encoded = encodeURI(filename);

    bgEl.classList.remove('active');
    bgBlur.classList.remove('active');

    setTimeout(() => {
        bgEl.style.backgroundImage = 'url("' + encoded + '")';
        bgBlur.style.backgroundImage = 'url("' + encoded + '")';
        bgEl.classList.add('active');
        bgBlur.classList.add('active');
    }, 100);
}

function goToScene(sceneId) {
    const scene = script[sceneId];
    if (!scene) return;

    currentScene = sceneId;
    currentLine = 0;

    if (scene.isPribit) {
        const overlay = document.getElementById('pribit-overlay');
        overlay.classList.add('show');
        setTimeout(() => overlay.classList.remove('show'), 2500);
    }

    setBackground(scene.bg);

    if (scene.theme) playTheme(scene.theme);
    if (scene.title) showChapterTitle(scene.title, scene.subtitle);

    if (scene.needs) {
        for (const k in scene.needs) {
            if (state.inner[k] !== undefined) {
                state.inner[k] = Math.max(0, Math.min(100, state.inner[k] + scene.needs[k]));
            }
        }
        updateHUD();
    }

    document.getElementById('choices').innerHTML = '';
    showLine();
}

function showChapterTitle(title, subtitle) {
    const el = document.getElementById('chapter-title');
    el.innerHTML = title + (subtitle ? '<small>' + subtitle + '</small>' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3400);
}

function showLine() {
    const scene = script[currentScene];
    if (currentLine >= scene.lines.length) {
        if (scene.type === 'ending') { showEnding(); return; }
        showChoices();
        return;
    }
    const line = scene.lines[currentLine];
    document.getElementById('speaker').textContent = line.speaker || '...';
    typeText(line.text);
}

function typeText(text) {
    const el = document.getElementById('dialogue-text');
    el.textContent = '';
    isTyping = true;
    let i = 0;
    clearInterval(typingTimer);
    typingTimer = setInterval(() => {
        if (i < text.length) {
            el.textContent += text[i];
            i++;
        } else {
            clearInterval(typingTimer);
            isTyping = false;
        }
    }, 22);
}

function nextLine() {
    if (document.getElementById('choices').children.length > 0) return;
    if (isTyping) {
        clearInterval(typingTimer);
        const scene = script[currentScene];
        document.getElementById('dialogue-text').textContent = scene.lines[currentLine].text;
        isTyping = false;
        return;
    }
    currentLine++;
    showLine();
}

function showChoices() {
    const scene = script[currentScene];
    const el = document.getElementById('choices');
    el.innerHTML = '';
    if (!scene.choices || scene.choices.length === 0) return;

    scene.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn' + (choice.pribit ? ' pribit' : '');
        btn.textContent = choice.text;
        if (choice.pribit && pribitUsed[currentScene]) btn.style.display = 'none';

        btn.onclick = () => {
            if (choice.pribit) {
                pribitUsed[currentScene] = true;
                state.flags.pribit_count = (state.flags.pribit_count || 0) + 1;
            }
            state.choices[currentScene] = choice.text;
            if (choice.needs) {
                for (const k in choice.needs) {
                    if (state.inner[k] !== undefined) {
                        state.inner[k] = Math.max(0, Math.min(100, state.inner[k] + choice.needs[k]));
                    }
                }
            }
            updateHUD();
            goToScene(choice.next);
        };
        el.appendChild(btn);
    });
}

function updateHUD() {
    const f = document.getElementById('h-faith');
    const p = document.getElementById('h-pain');
    const m = document.getElementById('h-mask');
    const l = document.getElementById('h-lost');
    const h = document.getElementById('h-hope');
    if (f) f.style.width = state.inner.faith + '%';
    if (p) p.style.width = state.inner.pain + '%';
    if (m) m.style.width = state.inner.mask + '%';
    if (l) l.style.width = state.inner.lost + '%';
    if (h) h.style.width = state.inner.hope + '%';
}

function showEnding() {
    stopTheme();
    playTheme('insight');
    document.getElementById('end-title').textContent = '～ Бесконечная дорога ～';
    document.getElementById('end-text').textContent =
        'Он больше не искал. Не потому что нашёл. А потому что понял — искать было не нужно. Всё, что он искал, было рядом. Всю жизнь.';
    document.getElementById('end-quote').innerHTML =
        '«Бог не потерял тебя, Ибрагим.<br>Ты просто забыл, что тебя нашли.»';
    document.getElementById('end-screen').classList.add('show');

    if (failedImages.length > 0) {
        console.warn('⚠️ НЕ ЗАГРУЗИЛИСЬ ФОТО:', failedImages);
    } else {
        console.log('✅ Все фото загружены:', ALL_PHOTOS.length);
    }
}

document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        nextLine();
    }
});

setInterval(() => {
    const dust = document.createElement('div');
    dust.className = 'dust';
    dust.style.left = Math.random() * 100 + '%';
    dust.style.top = '100%';
    dust.style.animationDuration = (8 + Math.random() * 8) + 's';
    document.getElementById('game').appendChild(dust);
    setTimeout(() => dust.remove(), 16000);
}, 1000);

// ============================================================
// ЗАПУСК — ПРЕДЗАГРУЗКА ФОТО ПРИ ОТКРЫТИИ
// ============================================================
window.addEventListener('load', async () => {
    document.getElementById('preloader').classList.add('show');
    await preloadAllImages();
    await new Promise(r => setTimeout(r, 500));

    document.getElementById('preloader').classList.add('hide');
    setTimeout(() => {
        document.getElementById('preloader').classList.remove('show');
    }, 1000);

    if (failedImages.length > 0) {
        console.warn('⚠️ НЕ ЗАГРУЗИЛИСЬ ФОТО:', failedImages);
    } else {
        console.log('✅ Все фото загружены:', ALL_PHOTOS.length);
    }

    updateHUD();
});
</script>
