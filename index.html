<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ибрагим — Бесконечная дорога</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        overflow: hidden;
        font-family: 'Georgia', 'Times New Roman', serif;
        background: #000;
        user-select: none;
    }
    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    /* ==== ФОН ==== */
    .bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        transition: opacity 1.5s ease, transform 10s ease;
        opacity: 0;
    }
    .bg.active { opacity: 1; transform: scale(1.05); }

    .bg::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 40%, rgba(10,5,20,0.75) 100%);
    }

    /* ==== СПРАЙТ ИБРАГИМА ==== */
    #ibrahim {
        position: absolute;
        bottom: 180px;
        left: 50%;
        transform: translateX(-50%);
        height: 72vh;
        max-height: 720px;
        transition: opacity 0.8s, transform 0.8s;
        filter: drop-shadow(0 20px 50px rgba(0,0,0,0.8));
        z-index: 5;
        pointer-events: none;
    }
    #ibrahim img { height: 100%; width: auto; display: block; }
    #ibrahim.hidden { opacity: 0; transform: translateX(-50%) translateY(40px); }

    /* ==== ДИАЛОГ ==== */
    #dialogue-box {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        min-height: 240px;
        background: linear-gradient(180deg, rgba(10,5,20,0.4) 0%, rgba(5,2,12,0.95) 25%, rgba(5,2,12,0.99) 100%);
        backdrop-filter: blur(12px);
        border-top: 3px solid rgba(255,200,120,0.35);
        z-index: 10;
        padding: 24px 60px 30px;
        display: flex;
        flex-direction: column;
        cursor: pointer;
    }

    #speaker {
        display: inline-block;
        padding: 6px 22px;
        background: linear-gradient(180deg, #ffd966 0%, #d4a040 100%);
        color: #1a0a15;
        font-weight: bold;
        font-size: 15px;
        border-radius: 6px 6px 0 0;
        margin-bottom: -3px;
        box-shadow: 0 -4px 20px rgba(255,200,100,0.5);
        font-family: 'Georgia', serif;
        letter-spacing: 1.5px;
        align-self: flex-start;
    }

    #dialogue-text {
        flex: 1;
        font-size: 19px;
        line-height: 1.75;
        color: #f2eae2;
        text-shadow: 0 2px 10px rgba(0,0,0,0.95);
        overflow-y: auto;
        padding: 10px 0 0;
        min-height: 110px;
    }

    #dialogue-text::-webkit-scrollbar { width: 4px; }
    #dialogue-text::-webkit-scrollbar-thumb { background: rgba(255,200,120,0.3); border-radius: 2px; }

    #continue-hint {
        text-align: right;
        font-size: 13px;
        color: rgba(255,200,120,0.7);
        animation: blink 1.5s infinite;
        font-style: italic;
        margin-top: 6px;
    }
    @keyframes blink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
    }

    /* ==== ВЫБОР ==== */
    #choices {
        position: absolute;
        bottom: 260px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 14px;
        z-index: 15;
        width: 640px;
        max-width: 90vw;
    }

    .choice-btn {
        padding: 18px 32px;
        background: linear-gradient(90deg, rgba(40,20,60,0.92) 0%, rgba(60,30,90,0.92) 50%, rgba(40,20,60,0.92) 100%);
        border: 2px solid rgba(255,200,120,0.5);
        color: #f2eae2;
        font-size: 17px;
        font-family: 'Georgia', serif;
        cursor: pointer;
        transition: all 0.3s;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 6px 25px rgba(0,0,0,0.6);
        position: relative;
        overflow: hidden;
    }
    .choice-btn::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: #ffd966;
        transform: scaleY(0);
        transition: transform 0.3s;
    }
    .choice-btn:hover {
        background: linear-gradient(90deg, rgba(255,200,120,0.12) 0%, rgba(255,200,120,0.28) 50%, rgba(255,200,120,0.12) 100%);
        border-color: #ffd966;
        transform: translateY(-2px) translateX(6px);
        box-shadow: 0 10px 35px rgba(255,200,120,0.5);
    }
    .choice-btn:hover::before { transform: scaleY(1); }

    /* ==== ЗАГОЛОВОК ГЛАВЫ ==== */
    #chapter-title {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.7);
        color: #ffd966;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 50px rgba(255,200,120,0.9), 0 15px 40px rgba(0,0,0,0.95);
        opacity: 0;
        pointer-events: none;
        transition: all 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        letter-spacing: 10px;
        z-index: 100;
        text-align: center;
        font-size: 68px;
    }
    #chapter-title.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    #chapter-title small {
        display: block;
        font-size: 20px;
        letter-spacing: 6px;
        color: #ffb86c;
        margin-top: 16px;
        opacity: 0.85;
        font-style: italic;
    }

    /* ==== HUD ==== */
    #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 20;
        padding: 14px 18px;
        background: rgba(5,2,12,0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,200,120,0.3);
        border-radius: 12px;
        min-width: 230px;
    }
    #hud-title {
        font-size: 11px;
        color: #ffd966;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 6px;
        font-family: 'Georgia', serif;
    }
    .hud-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #d0c0e0;
    }
    .hud-icon { font-size: 15px; width: 20px; text-align: center; }
    .hud-bar {
        flex: 1;
        height: 8px;
        background: rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
    }
    .hud-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.6s;
    }

    /* ==== ВИНЬЕТКА ==== */
    #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
        z-index: 3;
    }

    /* ==== ПЫЛЬ ==== */
    .dust {
        position: absolute;
        width: 3px;
        height: 3px;
        background: rgba(255,220,150,0.5);
        border-radius: 50%;
        pointer-events: none;
        animation: float 9s linear infinite;
        z-index: 4;
    }
    @keyframes float {
        0% { transform: translate(0, 0) scale(1); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translate(80px, -100vh) scale(0.5); opacity: 0; }
    }

    /* ==== СТАРТ ==== */
    #start-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #1a0a15 0%, #0a0510 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 1.5s;
        text-align: center;
        padding: 20px;
    }
    #start-screen.hide { opacity: 0; pointer-events: none; }

    #start-title {
        font-size: 84px;
        color: #ffd966;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 60px rgba(255,200,120,0.7);
        letter-spacing: 12px;
        margin-bottom: 20px;
        animation: titleGlow 4s ease-in-out infinite;
    }
    @keyframes titleGlow {
        0%, 100% { text-shadow: 0 0 60px rgba(255,200,120,0.7); }
        50% { text-shadow: 0 0 90px rgba(255,200,120,1); }
    }
    #start-subtitle {
        font-size: 20px;
        color: #d0a060;
        font-style: italic;
        margin-bottom: 70px;
        letter-spacing: 5px;
    }
    #start-btn {
        padding: 22px 80px;
        font-size: 20px;
        background: linear-gradient(180deg, #ffd966 0%, #d4a040 100%);
        color: #1a0a15;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-family: 'Georgia', serif;
        font-weight: bold;
        letter-spacing: 4px;
        transition: all 0.3s;
        box-shadow: 0 0 50px rgba(255,200,120,0.5);
    }
    #start-btn:hover {
        transform: scale(1.06);
        box-shadow: 0 0 80px rgba(255,200,120,0.9);
    }
    #start-hint {
        margin-top: 50px;
        color: #6a5060;
        font-size: 13px;
        font-style: italic;
        letter-spacing: 2px;
        max-width: 500px;
        line-height: 1.6;
    }

    /* ==== ФИНАЛ ==== */
    #end-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, #2a1a2e 0%, #0a0510 100%);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 40px;
        text-align: center;
    }
    #end-screen.show { display: flex; animation: fadeIn 3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #end-title {
        font-size: 64px;
        color: #ffd966;
        margin-bottom: 40px;
        letter-spacing: 10px;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 70px rgba(255,200,120,0.7);
    }
    #end-text {
        font-size: 22px;
        color: #d0c0e0;
        max-width: 750px;
        line-height: 1.9;
        font-style: italic;
        margin-bottom: 50px;
    }
    #end-restart {
        padding: 18px 60px;
        font-size: 16px;
        background: transparent;
        color: #ffd966;
        border: 2px solid #ffd966;
        border-radius: 10px;
        cursor: pointer;
        font-family: 'Georgia', serif;
        letter-spacing: 3px;
        transition: 0.3s;
    }
    #end-restart:hover {
        background: #ffd966;
        color: #1a0a15;
    }

    @media (max-width: 900px) {
        #dialogue-box { min-height: 200px; padding: 20px 30px; }
        #dialogue-text { font-size: 16px; }
        #choices { width: 92%; bottom: 220px; }
        #chapter-title { font-size: 40px; letter-spacing: 4px; }
        #start-title { font-size: 50px; letter-spacing: 6px; }
        #ibrahim { height: 55vh; bottom: 160px; }
    }
</style>
</head>
<body>

<!-- СТАРТ -->
<div id="start-screen">
    <div id="start-title">ИБРАГИМ</div>
    <div id="start-subtitle">～ Бесконечная дорога ～</div>
    <button id="start-btn" onclick="startGame()">НАЧАТЬ</button>
    <div id="start-hint">
        Это история о парне, который искал себя.<br>
        О Боге. О любви. О потере.<br>
        О дороге без конца.
    </div>
</div>

<!-- ИГРА -->
<div id="game">

    <!-- ФОН -->
    <div class="bg active" id="bg" style="background-image: url('ishevsk.jpg')"></div>

    <!-- ВИНЬЕТКА -->
    <div id="vignette"></div>

    <!-- СПРАЙТ ИБРАГИМА -->
    <div id="ibrahim" class="hidden">
        <img src="ibrahim 2.jpeg" alt="Ибрагим">
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="hud-title">СОСТОЯНИЕ</div>
        <div class="hud-row"><span class="hud-icon">🍔</span><div class="hud-bar"><div class="hud-fill" id="h-food" style="background:#ff6b6b;width:70%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">😴</span><div class="hud-bar"><div class="hud-fill" id="h-sleep" style="background:#4dabf7;width:75%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">🚬</span><div class="hud-bar"><div class="hud-fill" id="h-nicotine" style="background:#adb5bd;width:60%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">🍺</span><div class="hud-bar"><div class="hud-fill" id="h-cider" style="background:#ffa94d;width:50%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">🕌</span><div class="hud-bar"><div class="hud-fill" id="h-faith" style="background:#b197fc;width:80%"></div></div></div>
        <div class="hud-row"><span class="hud-icon">✨</span><div class="hud-bar"><div class="hud-fill" id="h-mood" style="background:#ffd43b;width:70%"></div></div></div>
    </div>

    <!-- ЗАГОЛОВОК ГЛАВЫ -->
    <div id="chapter-title"></div>

    <!-- ВЫБОР -->
    <div id="choices"></div>

    <!-- ДИАЛОГ -->
    <div id="dialogue-box" onclick="nextLine()">
        <div id="speaker">Ибрагим</div>
        <div id="dialogue-text">...</div>
        <div id="continue-hint">▼ клик / пробел / Enter</div>
    </div>

</div>

<!-- ФИНАЛ -->
<div id="end-screen">
    <div id="end-title">КОНЕЦ</div>
    <div id="end-text"></div>
    <button id="end-restart" onclick="location.reload()">НАЧАТЬ СНОВА</button>
</div>

<script>
// ============================================================
// ИБРАГИМ — Бесконечная дорога
// Визуальная новелла · 8 глав · 4 концовки
// ============================================================

const state = {
    needs: { food: 70, sleep: 75, nicotine: 60, cider: 50, faith: 80, mood: 70 },
    choices: {},
    flags: {},
    currentScene: null,
    isTyping: false,
    typingTimer: null
};

// ============================================================
// СЦЕНАРИЙ
// ============================================================

const script = {

    // ============================================
    // ПРОЛОГ
    // ============================================
    prologue: {
        bg: 'ishevsk.jpg',
        showChar: false,
        title: 'ПРОЛОГ',
        subtitle: '～ Бесконечная дорога ～',
        lines: [
            { speaker: '...', text: 'Есть дороги, которые начинаются с детства.' },
            { speaker: '...', text: 'И есть дороги, по которым идёшь всю жизнь — и не находишь конца.' },
            { speaker: '...', text: 'Это история об Ибрагиме.' },
            { speaker: '...', text: 'О парне, который искал Бога. И себя. И не находил ни того, ни другого.' },
            { speaker: '...', text: 'Он думал, что жизнь — это про достижения. Про девушек. Про деньги.' },
            { speaker: '...', text: 'Но оказалось — жизнь про то, чтобы просто остаться собой. И дышать.' }
        ],
        choices: [{ text: 'Начать историю', next: 'ch1' }]
    },

    // ============================================
    // ГЛАВА 1: ИЖЕВСК — детство
    // ============================================
    ch1: {
        bg: 'ishevsk.jpg',
        showChar: false,
        title: 'ГЛАВА I',
        subtitle: '～ Ижевск ～',
        lines: [
            { speaker: '...', text: 'Ижевск. Небольшой город в Удмуртии. Здесь он родился.' },
            { speaker: '...', text: 'Бабушка с дедушкой. Мама. И кот Роджерс — рыжий, пушистый, свободный.' },
            { speaker: 'Ибрагим', text: 'Роджерс, ты — единственный, кто меня понимает.' },
            { speaker: '...', text: 'Роджерс смотрел на него мудро. Как будто знал что-то важное.' },
            { speaker: '...', text: 'Семья была мусульманская. Ибрагима отдали в мусульманскую школу.' },
            { speaker: '...', text: 'Он знал Коран, знал хадисы, знал правила. Знал больше, чем большинство взрослых.' },
            { speaker: 'Ибрагим', text: 'Но если я знаю всё — почему я не чувствую Бога?' },
            { speaker: '...', text: 'Этот вопрос не давал ему покоя. С шести лет. И до самого конца.' }
        ],
        choices: [
            { text: '«Может, я недостаточно верю?»', next: 'ch1_1', needs: { faith: +5 } },
            { text: '«Может, Бог — это не про правила?»', next: 'ch1_2', needs: { faith: -5 } },
            { text: '«Я узнаю когда-нибудь. Позже.»', next: 'ch1_3' }
        ]
    },

    ch1_1: {
        bg: 'ishevsk.jpg',
        showChar: false,
        lines: [
            { speaker: 'Ибрагим', text: 'Может, я недостаточно верю. Может, надо больше молиться.' },
            { speaker: '...', text: 'Он читал намаз. Пять раз в день. Старательно.' },
            { speaker: '...', text: 'Но пустота внутри оставалась.' },
            { speaker: 'Ибрагим', text: 'Я делаю всё правильно. Почему же так пусто?' }
        ],
        needs: { faith: +10, mood: -5 },
        choices: [{ text: '...', next: 'ch1_end' }]
    },

    ch1_2: {
        bg: 'ishevsk.jpg',
        showChar: false,
        lines: [
            { speaker: 'Ибрагим', text: 'Может, Бог — это не про правила. Может, это что-то другое.' },
            { speaker: '...', text: 'Эта мысль была страшной. И освобождающей одновременно.' },
            { speaker: 'Ибрагим', text: 'Я не хочу бояться Бога. Я хочу понимать.' },
            { speaker: '...', text: 'Он не сказал это никому. Но впервые почувствовал себя свободным.' }
        ],
        needs: { faith: -10, mood: +10 },
        flags: { free_thinker: true },
        choices: [{ text: '...', next: 'ch1_end' }]
    },

    ch1_3: {
        bg: 'ishevsk.jpg',
        showChar: false,
        lines: [
            { speaker: 'Ибрагим', text: 'Я пойму когда-нибудь. Позже.' },
            { speaker: '...', text: 'Но «позже» так и не наступало.' }
        ],
        choices: [{ text: '...', next: 'ch1_end' }]
    },

    ch1_end: {
        bg: 'ishevsk.jpg',
        showChar: false,
        lines: [
            { speaker: '...', text: 'А потом появилась Амина.' },
            { speaker: '...', text: 'Красивая. Умная. Он смотрел на неё — и забывал дышать.' },
            { speaker: 'Ибрагим', text: 'Амина, пойдём погуляем?' },
            { speaker: 'Амина', text: 'Нет. Ты не в моём вкусе.' },
            { speaker: '...', text: 'Это был первый удар. Но не последний.' },
            { speaker: 'Ибрагим', text: 'Ладно. Значит, не судьба.' },
            { speaker: '...', text: 'Но внутри что-то сломалось. Что-то, что он потом искал всю жизнь.' }
        ],
        needs: { mood: -20 },
        choices: [
            { text: '«Значит, есть кто-то лучше»', next: 'ch2', mood: 'neutral' },
            { text: '«Мне никто не нужен»', next: 'ch2', mood: 'sad' }
        ]
    },

    // ============================================
    // ГЛАВА 2: ЮЛЯ
    // ============================================
    ch2: {
        bg: 'ulya.jpg',
        showChar: false,
        title: 'ГЛАВА II',
        subtitle: '～ Юля ～',
        lines: [
            { speaker: '...', text: 'Ему было 11. Ей было 11. Они были детьми.' },
            { speaker: '...', text: 'Юля. Девочка с грустными глазами и громким смехом.' },
            { speaker: 'Ибрагим', text: 'Юля, а ты кем хочешь стать?' },
            { speaker: 'Юля', text: 'Не знаю. Может, никем. Может, мне не будет «потом».' },
            { speaker: 'Ибрагим', text: 'Почему?' },
            { speaker: 'Юля', text: 'Просто чувствую.' },
            { speaker: '...', text: 'Он не понял тогда. Но запомнил.' },
            { speaker: '...', text: 'Они гуляли. Играли. Смеялись. Впервые Ибрагим чувствовал, что не один.' },
            { speaker: 'Ибрагим', text: 'Юля, ты моя самая лучшая.' },
            { speaker: 'Юля', text: 'Ты тоже. Не забывай меня, ладно?' },
            { speaker: 'Ибрагим', text: 'Никогда.' }
        ],
        choices: [
            { text: '«Я буду рядом»', next: 'ch2_1', needs: { mood: +15 } },
            { text: '«Ты не права. Всё будет хорошо»', next: 'ch2_2' }
        ]
    },

    ch2_1: {
        bg: 'ulya.jpg',
        showChar: false,
        lines: [
            { speaker: '...', text: 'Он держал её за руку. Они стояли на берегу реки.' },
            { speaker: '...', text: 'Казалось, время остановилось.' },
            { speaker: '...', text: 'А через год Юля исчезла.' },

            { speaker: '...', text: 'Он стоит на обочине. Как всегда.' },
            { speaker: '...', text: 'Туман над полем. Закат вдалеке.' },
            { speaker: 'Ибрагим', text: 'Жизнь — это дорога. Без конца. Без финиша.' },
            { speaker: '...', text: 'Он знает: будут ещё потери. Будут ещё боли.' },
            { speaker: '...', text: 'Но будет и свет. И утро. И ещё одна сигарета.' },
            { speaker: '...', text: 'Он улыбается. Закуривает.' },
            { speaker: 'Ибрагим', text: 'Пойдём дальше.' },
            { speaker: '...', text: 'И делает шаг.' },
            { speaker: '...', text: 'Конец.' }
        ],
        type: 'ending'
    }
};

// ============================================================
// ЛОГИКА
// ============================================================

let currentScene = null;
let currentLine = 0;
let isTyping = false;
let typingTimer = null;

function startGame() {
    document.getElementById('start-screen').classList.add('hide');
    setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        goToScene('prologue');
    }, 1000);
}

function goToScene(sceneId) {
    const scene = script[sceneId];
    if (!scene) return;

    currentScene = sceneId;
    currentLine = 0;

    // Фон
    const bgEl = document.getElementById('bg');
    bgEl.classList.remove('active');
    setTimeout(() => {
        bgEl.style.backgroundImage = `url('${scene.bg}')`;
        bgEl.classList.add('active');
    }, 100);

    // Спрайт
    const ibrahimEl = document.getElementById('ibrahim');
    if (scene.showChar === false) {
        ibrahimEl.classList.add('hidden');
    } else {
        ibrahimEl.classList.remove('hidden');
    }

    // Заголовок главы
    if (scene.title) {
        showChapterTitle(scene.title, scene.subtitle);
    }

    // Очищаем выборы
    document.getElementById('choices').innerHTML = '';

    // Мысли
    if (scene.needs) {
        for (const k in scene.needs) {
            if (state.needs[k] !== undefined) {
                state.needs[k] = Math.max(0, Math.min(100, state.needs[k] + scene.needs[k]));
            }
        }
        updateHUD();
    }

    showLine();
}

function showChapterTitle(title, subtitle) {
    const el = document.getElementById('chapter-title');
    el.innerHTML = title + (subtitle ? '<small>' + subtitle + '</small>' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3200);
}

function showLine() {
    const scene = script[currentScene];

    if (currentLine >= scene.lines.length) {
        if (scene.type === 'ending') {
            showEnding(scene.title, scene.subtitle);
            return;
        }
        showChoices();
        return;
    }

    const line = scene.lines[currentLine];
    document.getElementById('speaker').textContent = line.speaker || '...';
    typeText(line.text);
}

function typeText(text) {
    const el = document.getElementById('dialogue-text');
    el.textContent = '';
    isTyping = true;
    let i = 0;

    clearInterval(typingTimer);
    typingTimer = setInterval(() => {
        if (i < text.length) {
            el.textContent += text[i];
            i++;
        } else {
            clearInterval(typingTimer);
            isTyping = false;
        }
    }, 25);
}

function nextLine() {
    if (document.getElementById('choices').children.length > 0) return;

    if (isTyping) {
        clearInterval(typingTimer);
        const scene = script[currentScene];
        document.getElementById('dialogue-text').textContent = scene.lines[currentLine].text;
        isTyping = false;
        return;
    }
    currentLine++;
    showLine();
}

function showChoices() {
    const scene = script[currentScene];
    const el = document.getElementById('choices');
    el.innerHTML = '';

    if (!scene.choices || scene.choices.length === 0) return;

    if (scene.choices.length === 1 && scene.choices[0].text === '...') {
        goToScene(scene.choices[0].next);
        return;
    }

    scene.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.onclick = () => {
            state.choices[currentScene] = choice.text;
            if (choice.needs) {
                for (const k in choice.needs) {
                    if (state.needs[k] !== undefined) {
                        state.needs[k] = Math.max(0, Math.min(100, state.needs[k] + choice.needs[k]));
                    }
                }
            }
            if (choice.flags) Object.assign(state.flags, choice.flags);
            updateHUD();
            goToScene(choice.next);
        };
        el.appendChild(btn);
    });
}

function updateHUD() {
    document.getElementById('h-food').style.width = state.needs.food + '%';
    document.getElementById('h-sleep').style.width = state.needs.sleep + '%';
    document.getElementById('h-nicotine').style.width = state.needs.nicotine + '%';
    document.getElementById('h-cider').style.width = state.needs.cider + '%';
    document.getElementById('h-faith').style.width = state.needs.faith + '%';
    document.getElementById('h-mood').style.width = state.needs.mood + '%';
}

function showEnding(title, subtitle) {
    document.getElementById('end-title').textContent = subtitle || 'КОНЕЦ';
    let text = '';
    if (subtitle && subtitle.includes('Светлая')) {
        text = 'Иногда достаточно просто дышать — и однажды станет светлее. Ибрагим нашёл свой свет. Через веру. Через маму. Через себя.';
    } else if (subtitle && subtitle.includes('Туман')) {
        text = 'Не все истории имеют счастливый конец. Некоторые просто не заканчиваются. Ибрагим научился жить в тумане. И это — его тихая победа.';
    } else if (subtitle && subtitle.includes('Юля')) {
        text = 'Некоторые люди остаются с нами навсегда. Не рядом — а внутри. Юля осталась в сердце Ибрагима. И это — его способ любить.';
    } else {
        text = 'Дорога не имеет конца. У неё есть только шаги. И Ибрагим делает шаг. Потом ещё один. Потом ещё. И так — всю жизнь.';
    }
    document.getElementById('end-text').textContent = text;
    document.getElementById('end-screen').classList.add('show');
}

// ============================================================
// УПРАВЛЕНИЕ
// ============================================================

document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        nextLine();
    }
});

// Пыль
setInterval(() => {
    const dust = document.createElement('div');
    dust.className = 'dust';
    dust.style.left = Math.random() * 100 + '%';
    dust.style.top = '100%';
    dust.style.animationDuration = (6 + Math.random() * 8) + 's';
    document.getElementById('game').appendChild(dust);
    setTimeout(() => dust.remove(), 14000);
}, 900);

updateHUD();
</script>

</body>
</html>
